# XcodeGen spec. The .xcodeproj is generated, not committed — a project
# file is a merge-conflict machine and nothing in it is worth reviewing.
#
#   brew install xcodegen && cd ios && xcodegen generate && open Sagax.xcodeproj
#
# XcodeGen is a development tool, not a dependency of the app: the app
# itself has none. If you'd rather not install it, make an iOS App target
# in Xcode by hand, add the App/ folder, and add the local CompanionCore
# package — the Info.plist keys below are the part that is easy to miss.
name: Sagax
options:
  bundleIdPrefix: ca.pulsatrix
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# Pulsatrix Technologies (owner of ca.pulsatrix.sagax in App Store Connect).
# Automatic signing: archive with -allowProvisioningUpdates and the App Store
# Connect API key, never with a forced distribution certificate.
settings:
  base:
    DEVELOPMENT_TEAM: PP546MZVHZ
    CODE_SIGN_STYLE: Automatic

packages:
  CompanionCore:
    path: .

schemes:
  Sagax:
    build:
      targets:
        Sagax: all
        SagaxUITests: [test]
    test:
      config: Debug
      targets:
        - SagaxUITests

targets:
  Sagax:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: AppShared
      - path: Shared
      # Shared with the Notification Service Extension: INSendMessageIntent
      # so a local banner can name the bot the same way a push does.
      - path: NotificationService/CommunicationNotification.swift
      # Release notes in the app (#184): docs/releases/*.md, read offline
      - path: ../docs/releases
        type: folder
        buildPhase: resources
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - sdk: Intents.framework
      - target: SagaxWidgetExtension
      - target: SagaxShareExtension
      - target: SagaxNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.pulsatrix.sagax
        MARKETING_VERSION: "0.7.7"
        CURRENT_PROJECT_VERSION: "75"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The catalog lives in App/, which is already a source path.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Mermaid diagrams in chat (MermaidBlockView.swift): the app draws them
    # offline with the same mermaid build as the desktop, copied from
    # node_modules (pnpm install at the repository root) into the bundle.
    # Not committed: it is a 5 MB generated file pinned by pnpm-lock.yaml.
    # A Release build without it fails; a Debug build warns and shows the
    # diagram source instead.
    postCompileScripts:
      - name: Bundle mermaid
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          src="${SRCROOT}/../node_modules/mermaid/dist/mermaid.min.js"
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/mermaid.min.js"
          if [ ! -f "$src" ]; then
            if [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: mermaid.min.js is missing; run pnpm install at the repository root"
              exit 1
            fi
            echo "warning: mermaid.min.js is missing (pnpm install); diagrams show their source"
            rm -f "$dst"
            exit 0
          fi
          mkdir -p "$(dirname "$dst")"
          cp -f "$src" "$dst"
    entitlements:
      path: App/Sagax.entitlements
      properties:
        # APNs (docs/ios-push.md). `development` here; an App Store or
        # TestFlight export rewrites it to `production`, and the app reads
        # the real value from its provisioning profile (PushRegistrar.swift).
        # The App ID needs the Push Notifications capability. The widget and
        # share extensions get no pushes and keep their own entitlements.
        aps-environment: development
        # Communication Notifications: the banner names the bot (or person)
        # and shows their avatar instead of the Sagax app icon. The App ID
        # `ca.pulsatrix.sagax` needs this capability in the Apple Developer
        # portal; automatic signing then puts it in the profile
        # (docs/ios-push.md).
        com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups:
          - group.ca.pulsatrix.sagax
        keychain-access-groups:
          - $(AppIdentifierPrefix)ca.pulsatrix.sagax
          - $(AppIdentifierPrefix)group.ca.pulsatrix.sagax
    info:
      path: App/Info.plist
      properties:
        # What appears under the icon. This MUST stay close to the App Store
        # listing name ("Sagax") or review rejects the build under
        # guideline 2.3.8.
        CFBundleDisplayName: Sagax
        CFBundleName: Sagax
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        SagaxKeychainAccessGroup: $(AppIdentifierPrefix)group.ca.pulsatrix.sagax
        # The bot's Live Activity — its face and ask in the Dynamic Island
        # and on the lock screen.
        NSSupportsLiveActivities: true
        # ProMotion: without this key an iPhone caps every animation the app
        # drives (SwiftUI, TimelineView, CADisplayLink) at 60 Hz; only system
        # scrolling reaches 120 Hz. iPad needs nothing.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          # sagax:// only. Servers and desktops from 0.4.0 emit it for
          # every phone link (pairing QR, sign-in return, widgets), and
          # plugin sign-in returns on sagax://oauth-done, which
          # ASWebAuthenticationSession catches before the app does.
          - CFBundleURLName: ca.pulsatrix.sagax
            CFBundleURLSchemes:
              - sagax
        # REQUIRED, and easy to lose. Without a launch screen iOS runs the
        # app in compatibility scaling: letterboxed inside black bars, with
        # everything drawn oversized, on every modern iPhone. An empty
        # dictionary is enough — it just has to exist.
        #
        # This cannot be an INFOPLIST_KEY_* build setting. Those are only
        # read when Xcode generates the Info.plist itself, and this target
        # supplies one, so they are silently ignored.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without these two, NWBrowser returns no results at all — silently.
        # It looks exactly like "no computers on this network", which is a
        # confusing hour if you don't know to look here.
        NSLocalNetworkUsageDescription: >-
          Sagax finds your computer on this network so your bots can
          reach you here.
        NSCameraUsageDescription: >-
          Sagax uses the camera to scan a pairing QR code shown on your
          computer and, when you choose it, to take your profile photo or a
          photo to send to a bot.
        NSMicrophoneUsageDescription: >-
          Sagax listens while you dictate a message to a bot, record a
          voice note for one, or talk with one on a call.
        # A call keeps going with the screen locked or the app in the
        # background, like a phone call (CallKit places it; this keeps its
        # audio running).
        UIBackgroundModes:
          - audio
          # a push wakes the app for a moment to recount the icon badge
          - remote-notification
        # Required for communication notifications (INSendMessageIntent).
        NSUserActivityTypes:
          - INSendMessageIntent
        NSFaceIDUsageDescription: >-
          Sagax uses Face ID to show a card number or another secret you
          saved. The bot never sees it.
        NSSpeechRecognitionUsageDescription: >-
          Sagax converts your speech into text so you can send it
          to a bot. Recognition runs on this phone when it can.
        # Phone tools (Features/PhoneTools): asked the first time a bot's
        # request is approved on this phone. French in App/InfoPlist.xcstrings.
        NSLocationWhenInUseUsageDescription: >-
          When you allow it on your phone, Sagax sends your position once to the bot that asked. Never in the background.
        NSContactsUsageDescription: >-
          When you allow it on your phone, Sagax searches your contacts for the name a bot asked about and sends only the details it asked for.
        NSRemindersFullAccessUsageDescription: >-
          When you allow it on your phone, Sagax reads or adds the reminders a bot asked for.
        NSRemindersUsageDescription: >-
          When you allow it on your phone, Sagax reads or adds the reminders a bot asked for.
        NSCalendarsFullAccessUsageDescription: >-
          When you allow it on your phone, Sagax reads your calendar for the days a bot asked about, or adds the event it asked for.
        NSCalendarsUsageDescription: >-
          When you allow it on your phone, Sagax reads your calendar for the days a bot asked about, or adds the event it asked for.
        NSFocusStatusUsageDescription: >-
          When you allow it on your phone, Sagax tells the bot that asked whether a Focus is on, so it can wait before disturbing you.
        NSBonjourServices:
          - _openmausbot._tcp
        # The companion listener is plain HTTP on a local address. ATS has
        # to be told, and this is the narrowest way to say it: local
        # networking only, not a blanket exception.
        #
        # NSAllowsLocalNetworking covers the private ranges — 10/8,
        # 172.16/12, 192.168/16, .local — and that is the whole LAN story.
        # It does *not* cover Tailscale: a tailnet address lives in
        # 100.64.0.0/10, the CGNAT range, which ATS treats as ordinary
        # public internet and blocks over plain HTTP. The address cannot be
        # exempted (ATS exceptions are by name, not by subnet), but the
        # MagicDNS name can be, and every tailnet name ends in ts.net — so
        # connect by name and this one entry covers every machine you own.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  # Native navigation coverage uses bundled synthetic data and no pairing.
  SagaxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        # recordings a call test says into the app, read from this checkout
        excludes:
          - "CallAudio/**"
    dependencies:
      - target: Sagax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.pulsatrix.sagax.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sagax

  # The system share sheet can send a link, text, image, or document straight
  # to a paired bot without first opening the containing app. Connection
  # metadata lives in the App Group; the bearer remains in the shared
  # Keychain access group.
  SagaxShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: AppShared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.pulsatrix.sagax.share
        MARKETING_VERSION: "0.7.7"
        CURRENT_PROJECT_VERSION: "75"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
    entitlements:
      path: ShareExtension/SagaxShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ca.pulsatrix.sagax
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.ca.pulsatrix.sagax
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Sagax
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SagaxKeychainAccessGroup: $(AppIdentifierPrefix)group.ca.pulsatrix.sagax
        # ATS is evaluated for URLSession work performed by the extension too.
        # Mirror the containing app's narrow local/Tailscale exceptions so a
        # share can reach the same already-paired routes. Local-network privacy
        # usage text remains on the containing app, per Apple's extension rules.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 4
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 4

  # A push with `mutable-content` runs here while the app is closed: it
  # downloads the bot's avatar and donates INSendMessageIntent so the
  # banner shows the bot's name and face (docs/ios-push.md).
  SagaxNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: AppShared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - sdk: Intents.framework
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.pulsatrix.sagax.notification
        MARKETING_VERSION: "0.7.7"
        CURRENT_PROJECT_VERSION: "75"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
    entitlements:
      path: NotificationService/SagaxNotificationService.entitlements
      properties:
        com.apple.developer.usernotifications.communication: true
        com.apple.security.application-groups:
          - group.ca.pulsatrix.sagax
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.ca.pulsatrix.sagax
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Sagax
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SagaxKeychainAccessGroup: $(AppIdentifierPrefix)group.ca.pulsatrix.sagax
        NSUserActivityTypes:
          - INSendMessageIntent
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService

  # The Live Activity lives in a widget extension, alongside the home-screen
  # widgets. It shares the mascot's drawing and data with the app, and the
  # activity contract in Shared/.
  SagaxWidgetExtension:
    type: app-extension
    platform: iOS
    # Live Activities and the Dynamic Island arrived in 16.1, so this
    # extension cannot go as low as the app itself. iPhones on 16.0 simply
    # install the app without the widget extension.
    deploymentTarget: "16.1"
    sources:
      - path: Widgets
      - path: Shared
      # Home-screen widgets read their snapshot from the App Group, and the
      # answer intent resolves tokens through the same shared connection
      # store the Share extension uses.
      - path: AppShared
      # The Sagax characters, drawn still: everything in App/Mascots except
      # BotMascotView, which loads pictures through the app's Session.
      - path: App/Mascots/MascotPaint.swift
      - path: App/Mascots/MausState.swift
      - path: App/Mascots/MascotCharacterView.swift
      - path: App/Mascots/MascotComets.swift
      - path: App/Mascots/OwlMascotView.swift
      - path: App/Mascots/OwlSkinFx.swift
      - path: App/Mascots/ShapeMascotView.swift
      - path: App/Mascots/TrombiMascotView.swift
      - path: App/Mascots/BunbuMascotView.swift
      - path: App/Mascots/ShibaMascotView.swift
      - path: App/Mascots/GrumpMascotView.swift
      - path: App/Mascots/OgreMascotView.swift
      - path: App/Mascots/FrogMascotView.swift
      - path: App/Mascots/CrabMascotView.swift
      # MascotState resolves the face for the post-answer refresh a widget
      # performs; it is self-contained above Core, so it rides along.
      - path: App/MascotState.swift
    dependencies:
      # The mascots' art, its path parser and the bot's look live in
      # CompanionCore. The extension shares the drawing with the app, so it
      # has to share the art too.
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.pulsatrix.sagax.widgets
        MARKETING_VERSION: "0.7.7"
        CURRENT_PROJECT_VERSION: "75"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
    # The widget extension joins the trusted-extension family the Share
    # extension set up: the App Group carries its snapshot, and the shared
    # keychain access group carries the tokens its answer intent will ask
    # for.
    entitlements:
      path: Widgets/SagaxWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ca.pulsatrix.sagax
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.ca.pulsatrix.sagax
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Sagax
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SagaxKeychainAccessGroup: $(AppIdentifierPrefix)group.ca.pulsatrix.sagax
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
