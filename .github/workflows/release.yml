# One-button releases: builds macOS (arm64 + x64, signed, notarized, stapled),
# Windows, and Ubuntu from ONE commit, assembles a complete draft in this
# repository with verified feeds, and mirrors it to the legacy releases repo
# so already-installed builds can cross the updater migration safely.
#
# Every gate below exists because its absence shipped (or nearly shipped) a
# broken build from a laptop:
#   - clean output dirs        -> 0.1.15 "app is damaged" (stale dist/ broke the seal)
#   - codesign gate BEFORE     -> notarization ACCEPTS invalid signatures
#   - packaged-server smoke    -> 0.1.24 died on launch (unbundled zod import)
#   - proxy-path probe         -> the 0.1.24 fix broke every helper while
#                                 /api/health stayed green
#   - staple, THEN hash        -> stapling rewrites bytes; stale feeds make
#                                 electron-updater reject every update
#   - blockmap regeneration    -> stale differential maps waste every updater's
#                                 bandwidth silently
#   - assemble-then-publish    -> 0.1.24 sat as an invisible draft; a mac-only
#                                 publish 404s the README's other buttons
#
# One-time setup (repo secrets) is documented in docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      publish:
        description: "Publish immediately after assembly (otherwise leave a draft for review)"
        required: false
        type: boolean
        default: false
      ship_without_ci:
        description: "Emergency only: skip waiting for the commit's passing CI check"
        required: false
        type: boolean
        default: false
      server_image_tag:
        description: "Only (re)publish the public server image for this published release tag (pulsa-vX.Y.Z); nothing else runs"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - package.json
  # A Sagax release is published from the build Mac (`gh release create
  # pulsa-vX.Y.Z`, docs/releasing.md). That publish is the one moment the
  # public server image is built: once per release, never on a push or a PR
  # (owner 2026-10-14). Every other job skips this event.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      should_release: ${{ steps.pin.outputs.should_release }}
      server_image: ${{ steps.image.outputs.server_image }}
      image_version: ${{ steps.image.outputs.image_version }}
      image_latest: ${{ steps.image.outputs.image_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.server_image_tag || inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: pin
        env:
          BEFORE: ${{ github.event.before }}
          SERVER_IMAGE_TAG: ${{ inputs.server_image_tag }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          current=$(node -p "require('./package.json').version")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          should_release=true
          # A published release, or a dispatch that names an image tag, builds
          # the server image only (job server-image), never the installers.
          if [ "$GITHUB_EVENT_NAME" = release ] || [ -n "$SERVER_IMAGE_TAG" ]; then
            should_release=false
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            git cat-file -e "$BEFORE:package.json" 2>/dev/null || {
              echo "::error::cannot verify the version before this push; refusing to start a release"
              exit 1
            }
            previous=$(git show "$BEFORE:package.json" | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))')
            if [ "$previous" = "$current" ]; then
              echo "package.json changed without a version bump; skipping the release"
              should_release=false
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
      - id: image
        name: Decide whether this run publishes the public server image
        # Sagax tags are pulsa-vX.Y.Z (docs/releasing.md). The image is tagged
        # X.Y.Z, X.Y and sha-<commit>; `latest` only for the repository's
        # latest full release, so a pre-release never becomes the default.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          SERVER_IMAGE_TAG: ${{ inputs.server_image_tag }}
        run: |
          tag="${SERVER_IMAGE_TAG:-$EVENT_TAG}"
          server_image=false
          image_version=
          image_latest=false
          if [[ "$tag" =~ ^pulsa-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            image_version="${BASH_REMATCH[1]}"
            fork=$(node -p "require('./package.json').forkVersion")
            if [ "$fork" != "$image_version" ]; then
              echo "::error::$tag checks out forkVersion $fork, not $image_version"
              exit 1
            fi
            server_image=true
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            if [ "$PRERELEASE" != true ] && [ "$latest" = "$tag" ]; then image_latest=true; fi
          elif [ -n "$tag" ]; then
            echo "$tag is not a Sagax release tag (pulsa-vX.Y.Z); no server image"
          fi
          {
            echo "server_image=$server_image"
            echo "image_version=$image_version"
            echo "image_latest=$image_latest"
          } >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published canonical release
        if: steps.pin.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on $GITHUB_REPOSITORY — bump the version first"
            exit 1
          fi
      - name: Refuse to overwrite a published legacy mirror
        if: steps.pin.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::RELEASES_PAT is required for the updater bridge"; exit 1; }
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo milind-soni/openmausbot-releases --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on the legacy mirror — recover the canonical draft instead of rebuilding bytes"
            exit 1
          fi

  ci:
    # Ship only a commit whose code passed `CI` (ci.yml's gate, vitest really
    # run): its own run, a run on a commit with the same tree, or, for a
    # version-only bump, its parent's (scripts/release-ci.mjs, docs/ci.md).
    # The wait overlaps the platform builds, so a green commit costs no time;
    # a red or missing verdict stops the release before any draft exists. Main keeps
    # one CI run going and one waiting, so a burst of merges can replace the
    # release commit's own run: scripts/release-ci.mjs then runs CI on the
    # commit in its own lane (a release-ci/v<version> branch no merge can
    # touch) and deletes that branch afterwards.
    name: CI passed on the release commit
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      # read CI runs, start CI in the release lane, and re-run jobs that
      # never got a runner
      actions: write
      # create and delete the release-ci/v<version> branch
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release-ci.mjs
            scripts/ci-scope.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Wait for the CI check on the pinned commit
        if: ${{ !inputs.ship_without_ci }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-ci.mjs

  mac:
    name: macOS arm64 + x64 (sign, notarize, staple)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache in a release build: a cache entry written from
          # the default branch scope could be poisoned and then restored into a
          # job that signs or publishes (CodeQL actions/cache-poisoning).
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package both architectures
        run: pnpm package:mac

      - name: "Gate: both packaged apps use the canonical updater feed"
        run: |
          for app in release/mac-arm64/Pulsa Bot.app release/mac/Pulsa Bot.app; do
            update="$app/Contents/Resources/app-update.yml"
            test -f "$update" || { echo "::error::missing $update"; exit 1; }
            grep -Eq '^owner: milind-soni$' "$update" || { echo "::error::wrong update owner in $update"; exit 1; }
            grep -Eq '^repo: Pulsa Bot$' "$update" || { echo "::error::wrong update repo in $update"; exit 1; }
          done

      - name: "Gate: the signature must verify BEFORE notarization"
        run: |
          for app in release/mac-arm64/Pulsa Bot.app release/mac/Pulsa Bot.app; do
            codesign --verify --deep --strict "$app"
            bin="$app/Contents/Resources/cloudflared/cloudflared"
            test -x "$bin" || { echo "::error::missing executable $bin"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-LICENSE.txt" \
              || { echo "::error::missing cloudflared license in $app"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-README.md" \
              || { echo "::error::missing cloudflared provenance in $app"; exit 1; }
            codesign --verify --strict "$bin"
            app_team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            bin_team=$(codesign -dv --verbose=4 "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            test -n "$app_team" && test "$bin_team" = "$app_team" || {
              echo "::error::cloudflared is not signed by the app's Developer ID team in $app"; exit 1; }
            for browser_bin in "$app/Contents/Resources/browser-engine/agent-browser" "$app/Contents/Resources/browser-engine/chrome/"*/chrome-headless-shell; do
              test -x "$browser_bin"
              codesign --verify --strict "$browser_bin"
              browser_team=$(codesign -dv --verbose=4 "$browser_bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
              test "$browser_team" = "$app_team" || { echo "::error::browser runtime has the wrong signing team"; exit 1; }
            done
            echo "ok: $app"
          done

      - name: "Gate: signed native browser works with an empty home"
        run: |
          case "$(node -p process.arch)" in
            arm64) resources="$PWD/release/mac-arm64/Pulsa Bot.app/Contents/Resources" ;;
            x64) resources="$PWD/release/mac/Pulsa Bot.app/Contents/Resources" ;;
            *) exit 1 ;;
          esac
          node scripts/smoke-browser-bundle.mjs --resources "$resources"
          SAGAX_SMOKE_DIST="$resources/server" node scripts/smoke-packaged-server.mjs --browser-bundle "$resources/browser-engine"

      - name: "Gate: both packaged servers start and every helper path resolves"
        run: |
          for app in release/mac-arm64/Pulsa Bot.app release/mac/Pulsa Bot.app; do
            res="$app/Contents/Resources"
            # the server tree is plain JS — runnable on the runner's node
            # regardless of the app binary's arch
            SAGAX_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, p]) => !existsSync(p));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} proxies resolve in ${server}`);
          EOF
            for bin in "$res/cua-driver" "$res/Pulsa Bot Speech.app/Contents/MacOS/speech-helper"; do
              lipo -archs "$bin" | grep -q "x86_64" || { echo "::error::$bin lacks x86_64"; exit 1; }
              lipo -archs "$bin" | grep -q "arm64" || { echo "::error::$bin lacks arm64"; exit 1; }
            done
            cloudflared="$res/cloudflared/cloudflared"
            expected_arch=x86_64
            case "$app" in *mac-arm64*) expected_arch=arm64 ;; esac
            cloudflared="$res/cloudflared/cloudflared"
            for bin in "$res/cua-driver" "$res/cua-sdk/native/libcua_driver_sdk.dylib" \
              "$res/cua-sdk/native/cua_driver_node_runtime.node" "$res/android-platform-tools/darwin/adb" "$cloudflared"; do
              test "$(lipo -archs "$bin")" = "$expected_arch" || {
                echo "::error::$bin is not the expected $expected_arch executable"; exit 1; }
            done
            if [ "$(uname -m)" = "$expected_arch" ]; then
              "$cloudflared" version | grep -Fq "cloudflared version 2026.10.3 " || {
                echo "::error::$cloudflared has the wrong version"; exit 1; }
            fi
          done

      - name: Notarize all four artifacts
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for f in release/*.dmg release/*.zip; do
            out=$(xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          rm "$RUNNER_TEMP/notary.p8"

      - name: Staple, re-zip, regenerate blockmaps and the feed
        run: |
          xcrun stapler staple release/Pulsa Bot-*-arm64.dmg
          xcrun stapler staple release/Pulsa Bot-*-x64.dmg
          xcrun stapler staple release/mac-arm64/Pulsa Bot.app
          xcrun stapler staple release/mac/Pulsa Bot.app
          v=$(node -p "require('./package.json').version")
          rm -f "release/Pulsa Bot-$v-arm64.zip" "release/Pulsa Bot-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Pulsa Bot.app "release/Pulsa Bot-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac/Pulsa Bot.app "release/Pulsa Bot-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/Pulsa Bot-$v-arm64.zip" "release/Pulsa Bot-$v-x64.zip" \
            "release/Pulsa Bot-$v-arm64.dmg" "release/Pulsa Bot-$v-x64.dmg"
          # refreshes every hash from the post-staple bytes and refuses to
          # finish unless the feed matches the files on disk
          node scripts/regenerate-mac-feed.mjs

      - name: Stable-named copies for the README's /latest/download links
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Pulsa Bot-$v-arm64.dmg" release/Pulsa Bot.dmg
          cp "release/Pulsa Bot-$v-x64.dmg" release/Pulsa Bot-intel.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache in a release build: a cache entry written from
          # the default branch scope could be poisoned and then restored into a
          # job that signs or publishes (CodeQL actions/cache-poisoning).
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - name: Package (win)
        run: pnpm package:win
      - name: "Gate: bundled browser works with an empty home"
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
      - name: "Gate: packaged Windows server discovers its browser"
        env:
          SAGAX_SMOKE_DIST: ${{ github.workspace }}/release/win-unpacked/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - name: Verify the packaged tree and start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/server/desktop-entry.mjs" ] || { echo "::error::missing server/desktop-entry.mjs"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || { echo "::error::missing cloudflared provenance"; exit 1; }
          expected=76b2805253d0d6ffacb092a7acfbee99e7af6917835c0c5410e23f3ef5052da2
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::cloudflared hash is $actual"; exit 1; }
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.10.3 " || {
            echo "::error::cloudflared has the wrong version"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          grep -Eq '^owner: milind-soni$' "$res/app-update.yml" || { echo "::error::wrong update owner"; exit 1; }
          grep -Eq '^repo: Pulsa Bot$' "$res/app-update.yml" || { echo "::error::wrong update repo"; exit 1; }
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::publisherName on an unsigned build breaks every update"; exit 1
          fi
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" SAGAX_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Pulsa Bot-$v-setup.exe" release/Pulsa Bot-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Ubuntu 24.04 x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache in a release build: a cache entry written from
          # the default branch scope could be poisoned and then restored into a
          # job that signs or publishes (CodeQL actions/cache-poisoning).
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 openbox squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package (linux)
        run: pnpm package:linux
      - name: Verify the packaged updater target
        run: |
          update=release/linux-unpacked/resources/app-update.yml
          test -f "$update" || { echo "::error::missing $update"; exit 1; }
          grep -Eq '^owner: milind-soni$' "$update" || { echo "::error::wrong update owner"; exit 1; }
          grep -Eq '^repo: Pulsa Bot$' "$update" || { echo "::error::wrong update repo"; exit 1; }
      - name: Verify package contents and metadata
        run: node scripts/verify/release/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: "Gate: installed browser works with Ubuntu sandbox restrictions"
        run: node scripts/smoke-browser-bundle.mjs --resources /opt/Pulsa Bot/resources
      - name: "Gate: packaged Linux server discovers its browser"
        env:
          SAGAX_SMOKE_DIST: /opt/Pulsa Bot/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle /opt/Pulsa Bot/resources/browser-engine
      - name: Smoke the packages
        env:
          SAGAX_KEEP_SMOKE_DIR: "1"
          SAGAX_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge openmausbot || true
      - name: Stable-named copies and checksums
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/Pulsa Bot-$v-amd64.deb" release/Pulsa Bot-amd64.deb
          cp "release/Pulsa Bot-$v-x86_64.AppImage" release/Pulsa Bot.AppImage
          (cd release && sha256sum Pulsa Bot-$v-amd64.deb Pulsa Bot-$v-x86_64.AppImage > SHA256SUMS-ubuntu-x64.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Android APK
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - name: Sign only when the named keystore is a real file
        env:
          # These names are already read by android/app/build.gradle.kts.
          # SAGAX_KEYSTORE_FILE is a path. No secret in this repo holds the keystore bytes.
          SAGAX_KEYSTORE_FILE: ${{ secrets.SAGAX_KEYSTORE_FILE }}
          SAGAX_KEYSTORE_PASSWORD: ${{ secrets.SAGAX_KEYSTORE_PASSWORD }}
          SAGAX_KEY_ALIAS: ${{ secrets.SAGAX_KEY_ALIAS }}
          SAGAX_KEY_PASSWORD: ${{ secrets.SAGAX_KEY_PASSWORD }}
        run: |
          missing=""
          if [ -z "${SAGAX_KEYSTORE_FILE}" ] || [ ! -f "${SAGAX_KEYSTORE_FILE}" ]; then missing="${missing} SAGAX_KEYSTORE_FILE"; fi
          if [ -z "${SAGAX_KEYSTORE_PASSWORD}" ]; then missing="${missing} SAGAX_KEYSTORE_PASSWORD"; fi
          if [ -z "${SAGAX_KEY_ALIAS}" ]; then missing="${missing} SAGAX_KEY_ALIAS"; fi
          if [ -n "${missing}" ]; then
            echo "Android release will not be signed. Missing:${missing}"
            echo "SAGAX_KEY_PASSWORD is optional. No password was invented."
            echo "SIGN=no" >> "$GITHUB_ENV"
          else
            echo "SIGN=yes" >> "$GITHUB_ENV"
          fi
      - name: Build the release APK
        env:
          SAGAX_KEYSTORE_FILE: ${{ secrets.SAGAX_KEYSTORE_FILE }}
          SAGAX_KEYSTORE_PASSWORD: ${{ secrets.SAGAX_KEYSTORE_PASSWORD }}
          SAGAX_KEY_ALIAS: ${{ secrets.SAGAX_KEY_ALIAS }}
          SAGAX_KEY_PASSWORD: ${{ secrets.SAGAX_KEY_PASSWORD }}
        run: |
          if [ "$SIGN" != "yes" ]; then
            unset SAGAX_KEYSTORE_FILE SAGAX_KEYSTORE_PASSWORD SAGAX_KEY_ALIAS SAGAX_KEY_PASSWORD
            unset OPENMAUSBOT_KEYSTORE_FILE OPENMAUSBOT_KEYSTORE_PASSWORD OPENMAUSBOT_KEY_ALIAS OPENMAUSBOT_KEY_PASSWORD
          fi
          cd android
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/release-apk"
          if [ "$SIGN" = "yes" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/release-apk/Sagax.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/release-apk/Sagax-unsigned.apk"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.SIGN == 'yes'
        with:
          name: android-apk
          path: release-apk/Sagax.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.SIGN != 'yes'
        with:
          name: android-apk
          path: release-apk/Sagax-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  voice-acceptance:
    name: Real voice acceptance
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/voice-release-acceptance.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  assemble:
    name: Assemble the draft and verify every feed
    needs: [prepare, ci, mac, windows, linux, android-apk, voice-acceptance]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-mirror-v${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      # to dispatch the npm and Docker publishes on the new tag
      actions: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Refuse an incomplete installer or updater set
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          required=(
            latest-linux.yml latest-mac.yml latest.yml
            "Pulsa Bot-$VERSION-amd64.deb"
            "Pulsa Bot-$VERSION-arm64.dmg"
            "Pulsa Bot-$VERSION-arm64.dmg.blockmap"
            "Pulsa Bot-$VERSION-arm64.zip"
            "Pulsa Bot-$VERSION-arm64.zip.blockmap"
            "Pulsa Bot-$VERSION-setup.exe"
            "Pulsa Bot-$VERSION-setup.exe.blockmap"
            "Pulsa Bot-$VERSION-x64.dmg"
            "Pulsa Bot-$VERSION-x64.dmg.blockmap"
            "Pulsa Bot-$VERSION-x64.zip"
            "Pulsa Bot-$VERSION-x64.zip.blockmap"
            "Pulsa Bot-$VERSION-x86_64.AppImage"
            Pulsa Bot-amd64.deb Pulsa Bot-intel.dmg Pulsa Bot-setup.exe
            Pulsa Bot.AppImage Pulsa Bot.dmg SHA256SUMS-ubuntu-x64.txt
          )
          for file in "${required[@]}"; do
            test -s "assets/$file" || { echo "::error::missing or empty release asset: $file"; exit 1; }
          done
          apk=0
          for file in Sagax.apk Sagax-unsigned.apk; do
            if [ -s "assets/$file" ]; then apk=$((apk + 1)); fi
          done
          test "$apk" = 1 || { echo "::error::the release needs Sagax.apk when the named keystore is present, otherwise Sagax-unsigned.apk, and not both"; exit 1; }
          test "$(find assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "$(( ${#required[@]} + 1 ))" || {
            echo "::error::unexpected release asset set"; find assets -maxdepth 1 -type f -print; exit 1; }
      - name: Verify every feed hash against the actual bytes
        run: |
          cd assets
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, statSync } from "node:fs";
          const sha512 = (f) => createHash("sha512").update(readFileSync(f)).digest("base64");
          const expected = new Map([
            ["latest-mac.yml", [
              "Pulsa Bot-${{ needs.prepare.outputs.version }}-x64.zip",
              "Pulsa Bot-${{ needs.prepare.outputs.version }}-arm64.zip",
              "Pulsa Bot-${{ needs.prepare.outputs.version }}-x64.dmg",
              "Pulsa Bot-${{ needs.prepare.outputs.version }}-arm64.dmg",
            ]],
            ["latest.yml", ["Pulsa Bot-${{ needs.prepare.outputs.version }}-setup.exe"]],
            ["latest-linux.yml", [
              "Pulsa Bot-${{ needs.prepare.outputs.version }}-x86_64.AppImage",
              "Pulsa Bot-${{ needs.prepare.outputs.version }}-amd64.deb",
            ]],
          ]);
          let bad = 0;
          for (const [feed, expectedUrls] of expected) {
            const text = readFileSync(feed, "utf8");
            const entries = [...text.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)];
            const urls = entries.map(([, url]) => url).sort();
            if (JSON.stringify(urls) !== JSON.stringify([...expectedUrls].sort())) {
              console.error(`WRONG PATHS in ${feed}: ${urls.join(", ") || "none"}`);
              bad++;
              continue;
            }
            for (const [, url, hash, size] of entries) {
              const okHash = sha512(url) === hash;
              const okSize = statSync(url).size === Number(size);
              if (!okHash || !okSize) { console.error(`MISMATCH ${url} in ${feed}`); bad++; }
              else console.log(`ok ${url}`);
            }
          }
          if (bad) process.exit(1);
          console.log(`\nall feeds verified; ${readdirSync(".").length} assets staged`);
          EOF
      - name: Create or update the canonical draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          tag="v$VERSION"
          ensure_draft() {
            local repo=$1
            shift
            local attempt delay
            for attempt in 1 2 3 4 5; do
              gh release view "$tag" --repo "$repo" > /dev/null 2>&1 && return 0
              if gh release create "$tag" --repo "$repo" "$@"; then
                return 0
              fi
              # The API can create the release before a transient response
              # failure reaches gh. Recover that success before retrying.
              gh release view "$tag" --repo "$repo" > /dev/null 2>&1 && return 0
              test "$attempt" -lt 5 || {
                echo "::error::could not create $tag in $repo after $attempt attempts"
                return 1
              }
              delay=$((5 << (attempt - 1)))
              echo "::warning::release creation failed for $repo; retrying in ${delay}s ($attempt/5)"
              sleep "$delay"
            done
          }
          ensure_draft "$GITHUB_REPOSITORY" --target "$SHA" \
            --draft --title "Pulsa Bot $VERSION" --generate-notes
          target=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq .sha)
          test "$target_sha" = "$SHA" || {
            echo "::error::$tag draft targets $target_sha, not pinned release commit $SHA"
            exit 1
          }
          for file in assets/*; do
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
          # A rerun preserves human edits made while reviewing the canonical
          # draft, and mirrors that exact body into the compatibility release.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          echo "canonical asset count: $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"

      - name: Mirror the same draft for installed legacy clients
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          ensure_draft() {
            local repo=$1
            shift
            local attempt delay
            for attempt in 1 2 3 4 5; do
              gh release view "$tag" --repo "$repo" > /dev/null 2>&1 && return 0
              if gh release create "$tag" --repo "$repo" "$@"; then
                return 0
              fi
              gh release view "$tag" --repo "$repo" > /dev/null 2>&1 && return 0
              test "$attempt" -lt 5 || {
                echo "::error::could not create $tag in $repo after $attempt attempts"
                return 1
              }
              delay=$((5 << (attempt - 1)))
              echo "::warning::release creation failed for $repo; retrying in ${delay}s ($attempt/5)"
              sleep "$delay"
            done
          }
          ensure_draft milind-soni/openmausbot-releases \
            --draft --title "Pulsa Bot $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$tag" --repo milind-soni/openmausbot-releases \
            --title "Pulsa Bot $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          for file in assets/*; do
            gh release upload "$tag" "$file" --repo milind-soni/openmausbot-releases --clobber
          done
          echo "legacy asset count: $(gh release view "$tag" --repo milind-soni/openmausbot-releases --json assets --jq '.assets | length')"

      - name: Prove both drafts contain the exact staged bytes
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node --input-type=module - "$VERSION" <<'EOF'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const version = process.argv[2];
          const expected = new Map(readdirSync("assets").map((name) => [
            name,
            `sha256:${createHash("sha256").update(readFileSync(join("assets", name))).digest("hex")}`,
          ]));
          for (const [repo, token] of [
            [process.env.GITHUB_REPOSITORY, process.env.CANONICAL_TOKEN],
            ["milind-soni/openmausbot-releases", process.env.LEGACY_TOKEN],
          ]) {
            const json = execFileSync("gh", ["release", "view", `v${version}`, "--repo", repo, "--json", "assets"], {
              encoding: "utf8",
              env: { ...process.env, GH_TOKEN: token },
            });
            const assets = JSON.parse(json).assets;
            if (assets.length !== expected.size) throw new Error(`${repo}: expected ${expected.size} assets, got ${assets.length}`);
            for (const asset of assets) {
              if (expected.get(asset.name) !== asset.digest) throw new Error(`${repo}: digest mismatch for ${asset.name}`);
            }
            console.log(`ok: ${repo} has ${assets.length} byte-identical assets`);
          }
          EOF

      - name: Publish (only when asked to)
        if: ${{ inputs.publish }}
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The bridge build points at the canonical feed. Publish and verify
          # that destination before making the build visible to legacy clients.
          GH_TOKEN="$CANONICAL_TOKEN" gh release edit "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
          GH_TOKEN="$CANONICAL_TOKEN" gh release view "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -q false
          GH_TOKEN="$LEGACY_TOKEN" gh release edit "v$VERSION" \
            --repo milind-soni/openmausbot-releases --draft=false --latest
          GH_TOKEN="$LEGACY_TOKEN" gh release view "v$VERSION" \
            --repo milind-soni/openmausbot-releases --json isDraft --jq .isDraft | grep -q false
          echo "v$VERSION is live on the canonical feed and its legacy updater bridge"
          # Publishing created the tag with this workflow's token, and GitHub
          # starts no workflow from events that token creates. Start the two
          # tag-driven publishes by hand, on the tag, so they see refs/tags/v*.
          for workflow in npm-package.yml docker.yml; do
            GH_TOKEN="$CANONICAL_TOKEN" gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
          done
          echo "dispatched the npm package and Docker image publishes on v$VERSION"

  server-image:
    # The public, multi-arch Sagax server image that install.sh and
    # `sagax update` pull (docs/install.md). Built once per published release
    # from the tagged commit, with the repository's own Dockerfile and no
    # deployment's configuration: no domain, no keys, no organization. The
    # same gates as docker.yml's publish: push by digest to staging, scan both
    # platforms, zero critical and high findings, keyless signature and
    # vulnerability attestation, then the public tags move to that digest.
    # It never blocks or slows the installers: nothing here depends on it.
    name: Public server image (GHCR, amd64 + arm64)
    needs: prepare
    if: needs.prepare.outputs.server_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: server-image-${{ needs.prepare.outputs.image_version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Name the image
        # GHCR refuses a mixed-case path; github.repository keeps Sagax.
        run: |
          {
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "STAGING=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sagax-staging"
            echo "SAGAX_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.75.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.image_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.image_version }}
            type=raw,value=sha-${{ needs.prepare.outputs.sha }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.image_latest == 'true' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Sagax server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          outputs: type=image,name=${{ env.STAGING }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.sagax.engine-set=all
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.created=${{ env.SAGAX_BUILD_TIME }}
          build-args: |
            ENGINE_SET=all
            SAGAX_REQUIRE_ENGINES=1
            SAGAX_COMMIT_SHA=${{ needs.prepare.outputs.sha }}
            SAGAX_BUILD_TIME=${{ env.SAGAX_BUILD_TIME }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image
      - name: Assemble exception list
        env:
          TRIVYIGNORE_PRIVATE: ${{ secrets.TRIVYIGNORE_PRIVATE }}
        run: |
          set -euo pipefail
          node scripts/combine-trivyignore.mjs \
            --private-env TRIVYIGNORE_PRIVATE \
            --out /tmp/trivyignore.ci
      - name: Scan both platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            name="${platform#linux/}"
            trivy image \
              --format cosign-vuln \
              --scanners vuln \
              --ignorefile /tmp/trivyignore.ci \
              --timeout 30m \
              --platform "$platform" \
              --output "vuln-${name}.json" \
              "${STAGING}@${DIGEST}"
          done
      - name: Require zero critical and high findings
        run: node scripts/vuln-attestation.mjs vuln.json vuln-amd64.json vuln-arm64.json
      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${STAGING}@${DIGEST}"
      - name: Attest the vulnerability scan
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type vuln --predicate vuln.json "${STAGING}@${DIGEST}"
      - name: Promote the signed image to its public tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first=
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [ -z "$first" ]; then
              first=$tag
              # Copies the manifest, the signature and the attestation.
              cosign copy "${STAGING}@${DIGEST}" "$tag"
            else
              docker buildx imagetools create -t "$tag" "${IMAGE}@${DIGEST}"
            fi
          done <<< "$TAGS"
          [ -n "$first" ]
          got=$(docker buildx imagetools inspect "$first" | awk '/^Digest:/ {print $2; exit}')
          [ "$got" = "$DIGEST" ]
          inspect=$(docker buildx imagetools inspect "$first")
          for platform in linux/amd64 linux/arm64; do
            grep -q "Platform: *${platform}\$" <<<"$inspect" || { echo "::error::$first has no ${platform} image"; exit 1; }
          done
          echo "published ${IMAGE}:${{ needs.prepare.outputs.image_version }} (${DIGEST})"
