name: Docker image

on:
  # release.yml dispatches this on the tag it just published: a tag created
  # with the workflow token never fires push events on its own.
  workflow_dispatch:
  push:
    tags: ["v*"]
  # CI runs once, on the release candidate (manual dispatch): Owner 2026-10-14.

# One run per PR: a new push cancels the superseded run.
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: build image + boot smoke
    # A branch dispatch is the signing proof below, not this boot smoke.
    # A release dispatch still builds here first because publish needs it.
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image identity
        id: identity
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          docker build \
            --build-arg ENGINE_SET=all \
            --build-arg SAGAX_REQUIRE_ENGINES=1 \
            --build-arg SAGAX_COMMIT_SHA="${{ github.sha }}" \
            --build-arg SAGAX_BUILD_TIME="${{ steps.identity.outputs.time }}" \
            -t openmausbot:ci .
      - name: Refuse an image whose engine set is not the full production set
        run: |
          set -euo pipefail
          docker run --rm --entrypoint cat openmausbot:ci /app/engines/manifest.json > /tmp/engines-manifest.json
          docker inspect --format '{{json .Config.Labels}}' openmausbot:ci > /tmp/engines-labels.json
          node scripts/engine-image-gate.mjs \
            --manifest /tmp/engines-manifest.json \
            --labels /tmp/engines-labels.json \
            --sha "${{ github.sha }}"
      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tgz \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  /tmp/trivy.tgz" | sha256sum -c
          mkdir -p "$HOME/bin"
          tar -xzf /tmp/trivy.tgz -C "$HOME/bin" trivy
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/trivy" --version
      - name: Assemble exception list
        # Exceptions come only from the repository secret. Missing or
        # blank: fail closed. Comments only: the scan ignores nothing.
        # Smoke, publish, and the signing proof share this secret.
        env:
          TRIVYIGNORE_PRIVATE: ${{ secrets.TRIVYIGNORE_PRIVATE }}
        run: |
          set -euo pipefail
          node scripts/combine-trivyignore.mjs \
            --private-env TRIVYIGNORE_PRIVATE \
            --out /tmp/trivyignore.ci
      - name: Vulnerability gate
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile /tmp/trivyignore.ci --format table \
            openmausbot:ci
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile /tmp/trivyignore.ci --format json --output /tmp/trivy-gated.json \
            openmausbot:ci
          node scripts/trivy-ignore-guard.mjs --gated /tmp/trivy-gated.json
      - name: Ignore-list staleness guard
        run: |
          set -euo pipefail
          : > /tmp/trivyignore.empty
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile /tmp/trivyignore.empty --format json --output /tmp/trivy-raw.json \
            openmausbot:ci
          node scripts/trivy-ignore-guard.mjs --allow-empty --ignore /tmp/trivyignore.ci --scan /tmp/trivy-raw.json
      - name: Boot the container and prove the server + UI answer
        run: |
          set -euo pipefail
          docker run -d --name omb openmausbot:ci
          for i in $(seq 1 40); do
            if docker exec omb curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot; then break; fi
            sleep 2
            if [ "$i" = "40" ]; then docker logs omb; echo "server never became healthy"; exit 1; fi
          done
          # the renderer is served by the server itself (SAGAX_STATIC_DIR)
          docker exec omb curl -sf http://127.0.0.1:8799/ | grep -qi "<html" || { docker logs omb; echo "UI not served"; exit 1; }
          docker exec omb curl -sf http://127.0.0.1:8799/healthz > /tmp/healthz.json || { docker logs omb; echo "healthz request failed"; exit 1; }
          grep -q '"ok":true' /tmp/healthz.json || { echo "healthz body:"; cat /tmp/healthz.json; exit 1; }
          grep -q openmausbot /tmp/healthz.json || { echo "healthz body:"; cat /tmp/healthz.json; exit 1; }
          for i in $(seq 1 60); do
            if docker logs omb 2>&1 | grep -q '\[engines\] self-check:'; then break; fi
            sleep 2
            if [ "$i" = "60" ]; then docker logs omb; echo "engine self-check never logged"; exit 1; fi
          done
          docker logs omb > /tmp/omb-engines.log 2>&1
          node scripts/engine-image-gate.mjs --startup-log /tmp/omb-engines.log
          for bin in claude grok codex cursor-agent hermes; do
            docker exec omb "$bin" --version
          done
          docker exec -i omb sh -c 'python="$(dirname "$(readlink -f "$(command -v hermes)")")/python"; exec "$python" -' \
            < scripts/hermes-jwt-overlay-smoke.py
          docker logs omb | tail -5
      - name: Prove the image runs the open-source edition
        # This distribution does not ship the source-available enterprise layer.
        # A key with no layer must stay edition oss and say the layer is absent.
        run: |
          set -euo pipefail
          docker run -d --name omb-ent -e SAGAX_LICENSE_KEY=omb1.not.real openmausbot:ci
          for i in $(seq 1 40); do
            if docker exec omb-ent curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot; then break; fi
            sleep 2
            if [ "$i" = "40" ]; then docker logs omb-ent; echo "server never became healthy"; exit 1; fi
          done
          edition=$(docker exec omb-ent curl -sf http://127.0.0.1:8799/api/edition)
          echo "$edition"
          grep -q '"edition":"oss"' <<<"$edition"
          grep -q 'no enterprise layer exists' <<<"$edition"
          if docker exec omb-ent test -e /app/dist-server/enterprise; then echo "enterprise layer must not ship"; exit 1; fi
          docker rm -f omb-ent >/dev/null
      - name: Prove the non-root user can browse with the baked-in Chrome
        run: |
          set -euo pipefail
          test "$(docker exec omb id -un)" = maus
          timeout 45 docker exec omb agent-browser --session ci-browser open 'data:text/html,<title>OMB browser smoke</title><h1>Browser ready</h1>'
          timeout 15 docker exec omb agent-browser --session ci-browser get title | grep -Fx 'OMB browser smoke'
          timeout 15 docker exec omb agent-browser --session ci-browser close
      - name: Prove the server never binds a public interface
        # The loopback-trust model is the auth model, so the image must keep
        # the server unreachable from the container's own network. Probe from a
        # sibling container on the same bridge; a positive control first proves
        # the probe can see a socket that does bind 0.0.0.0.
        run: |
          set -euo pipefail
          probe() { docker run --rm --network bridge curlimages/curl:8.14.1 -s --max-time 3 "http://$1:$2/" >/dev/null; }
          docker run -d --name leaky --entrypoint node openmausbot:ci -e "require('http').createServer((q,s)=>s.end('leak')).listen(8799,'0.0.0.0')"
          sleep 2
          leaky_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' leaky)
          test -n "$leaky_ip"
          probe "$leaky_ip" 8799 || { echo "probe cannot see a 0.0.0.0 listener; the check would be vacuous"; exit 1; }
          docker rm -f leaky >/dev/null
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' omb)
          test -n "$ip"
          if probe "$ip" 8799 || probe "$ip" 8800; then
            echo "server answered on $ip — it must only bind 127.0.0.1"; exit 1
          fi
          echo "unreachable on $ip: loopback-only holds"
      - name: Run the tenant stack (server + Caddy) and pair like a browser would
        # deploy/docker-compose.yml is the product here: through TLS, prove that
        # nothing but the descriptor and the UI shell is served before pairing,
        # that a code minted inside the container turns into a Secure cookie
        # session, that the cookie is same-origin only, that the event stream is
        # unbuffered, and that hooks stay reachable without a session.
        run: |
          set -euo pipefail
          docker rm -f omb >/dev/null
          docker tag openmausbot:ci sagax:local
          printf 'DOMAIN=localhost\nENGINES=\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml up -d --no-build
          ready=0
          for i in $(seq 1 45); do
            if curl -sk -o /dev/null --max-time 2 https://localhost/.well-known/openmausbot/environment; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then docker compose -f deploy/docker-compose.yml logs; echo "caddy never answered"; exit 1; fi
          code() { curl -sk -o /dev/null -w '%{http_code}' --max-time 5 "$@"; }
          body() { curl -sk --max-time 10 "$@"; }
          H=https://localhost
          grep -q '"environmentId"' <<<"$(body $H/.well-known/openmausbot/environment)"   # descriptor is public
          grep -q '^{"app":"openmausbot","product":"sagax"}$' <<<"$(body $H/api/health)"  # the probe is public, and says only the app and product names
          test "$(code $H/api/bots)" = 403                                        # nothing else before pairing
          grep -q 'pair this device' <<<"$(body $H/api/bots)"
          grep -qi '<html' <<<"$(body $H/pair)"                                    # the UI shell is served so /pair can load
          test "$(code http://localhost/)" = 308                                   # HTTP redirects to HTTPS
          pairing=$(docker compose -f deploy/docker-compose.yml exec -T omb node dist-server/pair-cli.js --label ci)
          echo "$pairing"
          pcode=$(grep -o 'code=[A-Z2-9-]*' <<<"$pairing" | head -1 | cut -d= -f2)
          test -n "$pcode"
          jar=$(mktemp)
          paired=$(curl -sk --max-time 10 -c "$jar" -D - -X POST $H/api/auth/pair -H 'content-type: application/json' -d "{\"code\":\"$pcode\",\"cookie\":true}")
          grep -qi 'set-cookie: omb_session_' <<<"$paired"                        # cookie session
          grep -qi 'Secure' <<<"$paired"                                          # over TLS the cookie is Secure
          grep -qi 'HttpOnly' <<<"$paired"
          test "$(code -b "$jar" $H/api/health)" = 200                              # paired: the API answers
          grep -q openmausbot <<<"$(body -b "$jar" $H/api/health)"
          test "$(code -b "$jar" -H 'Origin: https://evil.example' -X POST -d '{}' $H/api/bots)" = 403   # cookie is same-origin only
          test "$(code -b "$jar" -H 'Origin: https://localhost' $H/api/auth/session)" = 200
          grep -q '"via":"cookie"' <<<"$(body -b "$jar" $H/api/auth/session)"
          grep -q '"label":"ci"' <<<"$(body -b "$jar" $H/api/auth/sessions)"        # listed for revocation
          # Hooks reach the webhook receiver without a session (not the app's
          # pairing wall), and an unknown endpoint without its bearer is refused
          # with the same 401 a wrong token gets: nothing says which part was wrong.
          hook=$(curl -sk --max-time 10 -w '\n%{http_code}' -X POST $H/hooks/wh_nope)
          test "$(tail -n1 <<<"$hook")" = 401
          test "$(head -n1 <<<"$hook")" = '{"error":"Unauthorized"}'
          test "$(code -X POST $H/hooks/not-a-hook)" = 404                         # only /hooks/wh_<id> is a hook
          # The event stream never ends, so curl's own --max-time exit (28) is expected;
          # the proof is that bytes arrived within the window (a buffering proxy sends none).
          sse=$( (curl -sk -b "$jar" -N --max-time 4 $H/api/events || true) | head -c 64 )
          test -n "$sse"                                                           # SSE streams, not buffered
          grep -q '"baseUrl":"https://localhost"' <<<"$(body -b "$jar" $H/api/webhooks)"   # SAGAX_WEBHOOK_PUBLIC_URL is advertised
          test "$(code $H/api/bots)" = 403                                        # and without the cookie it is still closed
          docker compose -f deploy/docker-compose.yml down -v
      # No Cloud Pro home image: deploy/fly (removed 2026-11-02) and
      # dist-server/cloud-home-start.js are not in this tree (upstream
      # #2407). Building that step failed the job after the engine gate.

  publish:
    name: publish to GHCR
    needs: build-and-smoke
    # Release dispatches on its published tag because GITHUB_TOKEN-created
    # tags do not start another workflow. A manual run publishes only on a
    # v* tag. A branch dispatch does not publish: its certificate names that
    # branch, and admission's subjectRegExp accepts only docker.yml at
    # refs/heads/main or refs/tags/v*. The signing-proof job covers that run.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Keyless signing. Fulcio copies the OIDC job_workflow_ref into the
    # certificate SAN and does not change case, so this repository stays
    # pulsatrixtechnologies/Sagax. Issuer is
    # https://token.actions.githubusercontent.com. The subject matches
    # admission.kyverno.subjectRegExp in the sandbox chart values
    # (^https://github\.com/pulsatrixtechnologies/Sagax/\.github/workflows/docker\.yml@refs/(heads/main|tags/v.*)$).
    # The vulnerability attestation uses predicate type
    # https://cosign.sigstore.dev/attestation/vuln/v1
    # (sandbox chart templates/admission.yaml).
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lowercase the image name
        # GHCR refuses a mixed-case path. github.repository keeps Sagax;
        # the image name does not. STAGING is the only push before the scan.
        # IMAGE is the production package and is written only at promotion.
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "STAGING=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sagax-staging" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.75.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - name: Image identity
        run: echo "SAGAX_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      # Push the digest to staging only. The production package is untouched
      # until the scan, the signature, and the vulnerability attestation
      # have succeeded. Buildx attaches a SLSA build-provenance attestation
      # to that digest (the admission policy does not read it).
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          outputs: type=image,name=${{ env.STAGING }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.sagax.engine-set=all
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ env.SAGAX_BUILD_TIME }}
          build-args: |
            ENGINE_SET=all
            SAGAX_REQUIRE_ENGINES=1
            SAGAX_COMMIT_SHA=${{ github.sha }}
            SAGAX_BUILD_TIME=${{ env.SAGAX_BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assemble exception list
        env:
          TRIVYIGNORE_PRIVATE: ${{ secrets.TRIVYIGNORE_PRIVATE }}
        run: |
          set -euo pipefail
          node scripts/combine-trivyignore.mjs \
            --private-env TRIVYIGNORE_PRIVATE \
            --out /tmp/trivyignore.ci
      - name: Scan both platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            name="${platform#linux/}"
            trivy image \
              --format cosign-vuln \
              --scanners vuln \
              --ignorefile /tmp/trivyignore.ci \
              --timeout 30m \
              --platform "$platform" \
              --output "vuln-${name}.json" \
              "${STAGING}@${DIGEST}"
          done
      - name: Require zero critical and high findings
        run: node scripts/vuln-attestation.mjs vuln.json vuln-amd64.json vuln-arm64.json
      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${STAGING}@${DIGEST}"
      - name: Attest the vulnerability scan
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type vuln --predicate vuln.json "${STAGING}@${DIGEST}"
      - name: Promote the signed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          first=
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [ -z "$first" ]; then
              first=$tag
              # Copies the manifest, the signature, and the attestation.
              cosign copy "${STAGING}@${DIGEST}" "$tag"
            else
              docker buildx imagetools create -t "$tag" "${IMAGE}@${DIGEST}"
            fi
          done <<< "$TAGS"
          [ -n "$first" ]
          got=$(docker buildx imagetools inspect "$first" | awk '/^Digest:/ {print $2; exit}')
          [ "$got" = "$DIGEST" ]

  signing-proof:
    name: signing proof
    # Same build, sign, and attest as publish, to a package admission does
    # not use. Dispatch this workflow on a branch (not a v* tag): the
    # certificate names this workflow at that ref, and the verify steps
    # require that identity. Publish does not run for that dispatch.
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lowercase the image name
        # GHCR refuses a mixed-case path. This is not the production image.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sagax-signing-test" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.75.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=pr436
      - name: Image identity
        run: echo "SAGAX_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      # Push by digest first. The pr436 tag moves only after the digest is
      # signed and the vulnerability attestation is attached.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.sagax.engine-set=all
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ env.SAGAX_BUILD_TIME }}
          build-args: |
            ENGINE_SET=all
            SAGAX_REQUIRE_ENGINES=1
            SAGAX_COMMIT_SHA=${{ github.sha }}
            SAGAX_BUILD_TIME=${{ env.SAGAX_BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assemble exception list
        env:
          TRIVYIGNORE_PRIVATE: ${{ secrets.TRIVYIGNORE_PRIVATE }}
        run: |
          set -euo pipefail
          node scripts/combine-trivyignore.mjs \
            --private-env TRIVYIGNORE_PRIVATE \
            --out /tmp/trivyignore.ci
      - name: Scan both platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            name="${platform#linux/}"
            trivy image \
              --format cosign-vuln \
              --scanners vuln \
              --ignorefile /tmp/trivyignore.ci \
              --timeout 30m \
              --platform "$platform" \
              --output "vuln-${name}.json" \
              "${IMAGE}@${DIGEST}"
          done
      - name: Require zero critical and high findings
        # Publish fails this step and does not sign. The proof still signs
        # so the certificate can be checked; the predicate keeps the counts.
        continue-on-error: true
        run: node scripts/vuln-attestation.mjs vuln.json vuln-amd64.json vuln-arm64.json
      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest the vulnerability scan
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type vuln --predicate vuln.json "${IMAGE}@${DIGEST}"
      - name: Point tags at the signed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=(-t "$tag")
          done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ]
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
      - name: Verify the signature, the attestation, and the platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          echo "signed digest: ${IMAGE}@${DIGEST}"
          echo "certificate identity: ${IDENTITY}"
          test "${IDENTITY}" = "https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
          cosign verify-attestation \
