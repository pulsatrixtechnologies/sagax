name: npm package

# Publishes @pulsatrixtechnologies/sagax. Releases are tagged pulsa-vX.Y.Z (docs/releasing.md);
# pushing that tag publishes the package at X.Y.Z. A manual run on a branch
# only builds and proves the tarball; a manual run on a pulsa-v tag publishes.
on:
  workflow_dispatch:
  push:
    tags: ["pulsa-v*"]

concurrency:
  group: npm-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pack-and-prove:
    name: assemble, pack, run standalone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build:server && pnpm exec vite build && node scripts/build-npm-package.mjs
      - name: Prove the packed tarball runs with no node_modules at all
        run: |
          set -euo pipefail
          cd release/npm && npm pack --silent && cd ../..
          rm -rf /tmp/omb-pack && mkdir -p /tmp/omb-pack && tar -xzf release/npm/pulsatrixtechnologies-sagax-*.tgz -C /tmp/omb-pack
          cd /tmp/omb-pack/package
          # Every check below is a silent grep/test; say which one failed, and what the server said.
          set -x
          trap 'echo "--- serve.log"; cat serve.log 2>/dev/null; echo "--- tunnel.log"; cat tunnel.log 2>/dev/null' ERR
          test ! -d node_modules
          node -e 'const p = require("./package.json"); if (p.name !== "@pulsatrixtechnologies/sagax" || p.bin?.sagax !== "cli.js" || Object.keys(p.bin).length !== 1) process.exit(1)'
          node cli.js --help | grep -q "sagax serve"
          HOME=/tmp/omb-pack/home node cli.js serve --no-pair --port 18799 --data-dir /tmp/omb-pack/data --label ci --public-url https://ci.example > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18799/api/health >/dev/null && break; sleep 1; done
          # The server answers /api/health before the CLI prints its "running" line, so wait for the line too.
          for i in $(seq 1 30); do grep -q "reachable at https://ci.example" serve.log && break; sleep 1; done
          grep -q "reachable at https://ci.example" serve.log
          SAGAX_PORT=18799 node cli.js status | grep -q "ci ·"
          SAGAX_PORT=18799 node cli.js pair --label "CI phone" | grep -q "open or scan:  https://ci.example/pair#code="
          SAGAX_PORT=18799 node cli.js sessions | grep -q "no paired devices yet"
          # the bundles also run directly by path (the image and docs do that), not only through cli.js:
          # a bundled module with a "run when executed directly" block would fire here
          node dist-server/openmausbot.js --help | grep -q "sagax serve"
          SAGAX_PORT=1 node dist-server/pair-cli.js > pair.out 2>&1 || true
          cat pair.out
          grep -q "no Sagax server" pair.out
          # --tunnel ships its own processes and fails closed without an account
          test -f dist-server/tunnel-guardian.js && test -f dist-server/prepare-cloudflared.js
          if [ -e enterprise ]; then echo "enterprise directory must not ship"; exit 1; fi
          if HOME=/tmp/omb-pack/home node cli.js serve --tunnel --port 18798 --data-dir /tmp/omb-pack/data2 > tunnel.log 2>&1; then echo "serve --tunnel should refuse without login"; exit 1; fi
          grep -q "run \`openmausbot login\` first" tunnel.log
          kill %1; wait %1 || true
      - name: The tag, the package and the release agree
        if: startsWith(github.ref, 'refs/tags/pulsa-v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#pulsa-v}"
          package_version=$(node -p 'require("./release/npm/package.json").version')
          fork_version=$(node -p 'require("./package.json").forkVersion')
          echo "tag $tag_version, package $package_version, forkVersion $fork_version"
          test "$tag_version" = "$package_version"
          test "$tag_version" = "$fork_version"
          test -f "release/npm/pulsatrixtechnologies-sagax-$tag_version.tgz"
      - name: Save the proven tarball (release tags only)
        if: startsWith(github.ref, 'refs/tags/pulsa-v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release/npm/pulsatrixtechnologies-sagax-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: publish to npm
    needs: pack-and-prove
    if: startsWith(github.ref, 'refs/tags/pulsa-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Optional protection: add required reviewers to this environment in the
    # repository settings. The trusted publisher on npmjs.com names it too.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release/npm
      # Trusted publishing (OIDC) is the normal path: npm trusts this
      # repository's npm-package.yml in the npm environment, so no registry
      # token is stored anywhere and none is asked for. One-time setup on
      # npmjs.com: @pulsatrixtechnologies/sagax → Settings → Trusted publishing → GitHub
      # Actions, organization pulsatrixtechnologies, repository Sagax,
      # workflow npm-package.yml, environment npm, allow npm publish.
      # Needs npm 11.5.1 or newer. With trusted publishing, npm also writes
      # the provenance attestation.
      #
      # NPM_TOKEN is optional and normally absent. npm only accepts a trusted
      # publisher on a package that already exists, so the very first version
      # may be published with a short-lived granular token stored as the
      # repository secret NPM_TOKEN; delete the secret once the trusted
      # publisher is set up. npm tries OIDC first and uses the token only if
      # that fails. The token is never written to disk: the npmrc names the
      # environment variable.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm_version=$(npm --version)
          echo "npm $npm_version"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("npm 11.5.1 or newer is required for trusted publishing"); process.exit(1); }' "$npm_version"
          npmrc="$RUNNER_TEMP/publish.npmrc"
          echo "registry=https://registry.npmjs.org/" > "$npmrc"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is set: used only if trusted publishing is not configured"
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> "$npmrc"
          fi
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish release/npm/pulsatrixtechnologies-sagax-*.tgz --provenance --access public
