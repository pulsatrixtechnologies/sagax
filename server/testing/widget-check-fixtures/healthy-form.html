<div class="card">
  <div class="card-header"><div><div class="eyebrow">Alertes</div><div class="card-title">Préférences de notification</div></div></div>
  <div class="card-content stack">
    <label><input type="checkbox" class="checkbox" checked> Recevoir les alertes par courriel</label>
    <label><input type="checkbox" class="checkbox"> Recevoir un résumé quotidien des billets ouverts</label>
    <label class="switch-row"><input type="checkbox" class="switch"> Mode silencieux la nuit</label>
    <div class="field"><label class="label" for="seuil">Seuil d'alerte (minutes)</label><input id="seuil" type="range" min="5" max="120" value="30"></div>
    <div class="field"><label class="label" for="canal">Canal</label><select id="canal" class="select"><option>Courriel</option><option>Teams</option></select></div>
  </div>
  <div class="card-footer"><button class="btn btn-outline">Annuler</button><button class="btn">Enregistrer</button></div>
</div>
