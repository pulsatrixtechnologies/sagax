name: Pinned Windows CUA diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Inspect the official x64 driver and its version result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'cua-version-probe'
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $archive = Join-Path $root 'official.zip'
            Invoke-WebRequest 'https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.45.4/cua-driver-rs-0.45.4-windows-x86_64-binary.zip' -OutFile $archive
            $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne '949927b4cb0519c6fb1377878d67d79a8d6fae7bc56cbed17c7aa26448d82cb5') { throw 'archive digest mismatch' }
            Expand-Archive -LiteralPath $archive -DestinationPath $root
            $exe = Join-Path $root 'cua-driver.exe'
            if (-not (Test-Path $exe -PathType Leaf)) { throw 'driver missing from archive root' }
            $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($exeHash -ne 'f87066ca41e6f8437923a372a2d3556c6131463f19d51a4be510f7e7c13eb4c5') { throw 'driver digest mismatch' }
            $env:PROBE_EXE = $exe
            @'
          const fs = require('node:fs');
          const { execFile } = require('node:child_process');
          const path = process.env.PROBE_EXE;
          const b = fs.readFileSync(path);
          const pe = b.readUInt32LE(60);
          if (b.readUInt16LE(0) !== 0x5a4d || b.readUInt32LE(pe) !== 0x4550 || b.readUInt16LE(pe + 4) !== 0x8664) throw Error('not x64 PE');
          const start = performance.now();
          execFile(path, ['--version'], {timeout: 5000, windowsHide: true}, (err, stdout, stderr) => {
            const code = err?.code ?? 0;
            console.log(JSON.stringify({arch: process.arch, node: process.version, code, ntstatus: typeof code === 'number' ? (code >>> 0).toString(16) : null, signal: err?.signal, killed: err?.killed, elapsedMs: Math.round(performance.now() - start), stdout: stdout.trim().slice(0,256), stderr: stderr.trim().slice(0,256)}));
            if (err || stdout.match(/cua-driver\s+([\d.]+)/)?.[1] !== '0.45.4') process.exitCode = 1;
          });
          '@ | node
            if ($LASTEXITCODE -ne 0) { throw 'version probe failed' }
          } finally {
            Remove-Item -Recurse -Force -LiteralPath $root
          }
