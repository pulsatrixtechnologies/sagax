# One Sagax tenant: the harness server plus Caddy for TLS + login.
#
# Caddy runs in the server's network namespace, so it reaches the server on
# 127.0.0.1 — the server never binds a public interface. Ports are therefore
# declared on the `omb` service (the namespace owner).
#
#   cp .env.example .env   # set DOMAIN
#   docker compose pull omb && docker compose up -d     # prebuilt image
#   docker compose up -d --build                        # or build from source
services:
  omb:
    # Graceful shutdown drains turns (5 s) then cleans up (6 s) before the
    # session registry closes; Docker's default 10 s would SIGKILL it first.
    stop_grace_period: 30s
    build:
      context: ..
      args:
        ENGINE_SET: ${ENGINE_SET:-all}
        SAGAX_REQUIRE_ENGINES: ${SAGAX_REQUIRE_ENGINES:-1}
        ENGINES: ${ENGINES:-}
        NATIVE_ENGINES: ${NATIVE_ENGINES:-}
        SAGAX_COMMIT_SHA: ${SAGAX_COMMIT_SHA:-}
        SAGAX_BUILD_TIME: ${SAGAX_BUILD_TIME:-}
    # prebuilt on every main push; `docker compose up --build` builds from source instead
    image: ghcr.io/milind-soni/openmausbot:latest
    restart: unless-stopped
    # The bots' browsers (docs/browser-packaging.md, "Process hygiene"): an
    # init collects the browser processes whose parents exit, and Chrome
    # gets the shared memory OMB's desktop containers give it.
    init: true
    shm_size: 512m
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
    environment:
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      # what the app prints as hook URLs — Caddy passes /hooks/* straight through
      OMB_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      # pairing links for remote clients point here (docs/self-hosting.md)
      OMB_PUBLIC_URL: https://${DOMAIN}
      # Who may sign in with an emailed code at /pair (docs/self-hosting.md,
      # "Sign in with your email"). Empty means pairing codes only.
      OMB_SIGNIN_EMAILS: ${OMB_SIGNIN_EMAILS:-}
      OMB_SIGNIN_MEMBER_EMAILS: ${OMB_SIGNIN_MEMBER_EMAILS:-}
      # Mail for sign-in codes and invitations (docs/self-hosting.md, "Sending
      # mail from your server"): smtp, sendgrid or twilio. Empty is ignored;
      # Settings > Email overrides any of these.
      OMB_MAIL_PROVIDER: ${OMB_MAIL_PROVIDER:-}
      OMB_MAIL_FROM: ${OMB_MAIL_FROM:-}
      OMB_MAIL_FROM_NAME: ${OMB_MAIL_FROM_NAME:-}
      OMB_SMTP_HOST: ${OMB_SMTP_HOST:-}
      OMB_SMTP_PORT: ${OMB_SMTP_PORT:-}
      OMB_SMTP_SECURE: ${OMB_SMTP_SECURE:-}
      OMB_SMTP_USER: ${OMB_SMTP_USER:-}
      OMB_SMTP_PASSWORD: ${OMB_SMTP_PASSWORD:-}
      OMB_SENDGRID_API_KEY: ${OMB_SENDGRID_API_KEY:-}
      OMB_TWILIO_API_KEY_SID: ${OMB_TWILIO_API_KEY_SID:-}
      OMB_TWILIO_API_KEY_SECRET: ${OMB_TWILIO_API_KEY_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: "service:omb"
    depends_on:
      omb:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
