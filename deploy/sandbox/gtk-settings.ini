# The look of the Sagax server environment desktop (deploy/sandbox/sagax-desktop):
# GTK's light Adwaita theme and the Papirus icons, so a folder, the terminal,
# the browser and each file type have their own icon.
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus
gtk-font-name=DejaVu Sans 10
gtk-application-prefer-dark-theme=false
gtk-enable-animations=false
gtk-recent-files-enabled=false
