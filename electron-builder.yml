appId: com.openmausbot.app
# The name people see: Dock, menu bar, installer, bundle folder (Sagax.app).
# It does NOT decide where data lives. Electron names the app (and so its
# userData folder and its safeStorage keychain entry) after package.json
# "name" (openmausbot), which electron-builder copies as is; see
# electron/user-data-location.mjs.
productName: Sagax
artifactName: Sagax-${version}-${arch}.${ext}
# Drives the Windows exe's VERSIONINFO LegalCopyright and (with package.json
# "author") CompanyName; see NOTICE for the retained upstream OpenMausBot
# attribution, which this packaging metadata does not replace.
copyright: Copyright © 2026 Pulsatrix Technologies Inc.

protocols:
  - name: Sagax package install
    schemes: [sagax]

# In-app auto-update reads latest-mac.yml + the .zip (macOS) or latest.yml +
# the NSIS .exe (Windows) from the PUBLIC releases in this source repo.
# Public → no token on users' machines. Baked into
# app-update.yml; both metadata files are emitted here even with
# --publish never, and must be uploaded to the GitHub release alongside the
# artifacts — a release missing latest.yml leaves every Windows install
# stranded on its installed version.
publish:
  - provider: github
    owner: pulsatrixtechnologies
    repo: sagax

directories:
  buildResources: build
  output: release

# electron-builder makes copied directories group-writable by default. The
# Linux CUA trust boundary requires root-owned package ancestors to be 0755.
afterPack: ./scripts/after-pack.mjs

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/**/*.test.*"
  # Test fixtures: what GitHub served for a release, never read at runtime.
  - "!electron/fixtures/update-feed/**"
  - "!electron/resources/speech-helper"
  - "!electron/resources/speech-helper.swift"
  - "!electron/resources/speech-helper-Info.plist"
  - "!electron/resources/Pulsa Bot Speech.app/**"
  # The Teach a skill recorder is gone, but a machine that once ran
  # `pnpm build:recorder` may still hold its helper build; never ship it.
  - "!electron/resources/recorder-helper"
  - "!electron/resources/recorder-helper.swift"
  - "!electron/resources/recorder-helper-Info.plist"
  - "!electron/resources/Pulsa Bot Recorder.app/**"
  - "!**/node_modules/**"
  - package.json

asar: true

extraResources:
  # Ship the app's own license terms (Apache-2.0) and notices in every
  # desktop distribution.
  - from: LICENSE
    to: licenses/Sagax-LICENSE.txt
  - from: NOTICE
    to: licenses/Sagax-NOTICE.txt
  # cloudflared is distributed under Apache-2.0 as a separate executable;
  # ship the Apache text (the repository's LICENSE) under its name so its
  # terms remain unambiguous.
  - from: LICENSE
    to: licenses/cloudflared-LICENSE.txt
  - from: third_party/cloudflared/README.md
    to: licenses/cloudflared-README.md
  # Tailcat is a separate executable (BSD 3-Clause). Ship its notice with the app.
  - from: third_party/tailcat/LICENSE
    to: licenses/tailcat-LICENSE.txt
  - from: third_party/hpke-js/core-LICENSE.txt
    to: licenses/hpke-core-LICENSE.txt
  - from: third_party/hpke-js/common-LICENSE.txt
    to: licenses/hpke-common-LICENSE.txt
  - from: third_party/jsquash-webp/jsquash-webp-LICENSE.txt
    to: licenses/jsquash-webp-LICENSE.txt
  - from: third_party/jsquash-webp/libwebp-LICENSE.txt
    to: licenses/libwebp-LICENSE.txt
  - from: third_party/jsquash-webp/libwebp-PATENTS.txt
    to: licenses/libwebp-PATENTS.txt
  # Code adapted from T3 Code (MIT): the bots' browser egress gate, the Antigravity runtime, citations.
  - from: third_party/t3-code/LICENSE
    to: licenses/t3-code-LICENSE.txt
  - from: third_party/98.css/LICENSE
    to: licenses/98css-LICENSE.txt
  - from: third_party/geist/OFL.txt
    to: licenses/Geist-OFL.txt
  - from: third_party/geist/OFL-Mono.txt
    to: licenses/Geist-Mono-OFL.txt
  - from: third_party/nerd-fonts-symbols/LICENSE
    to: licenses/nerd-fonts-symbols-LICENSE.txt
  - from: third_party/nerd-fonts-symbols/README.md
    to: licenses/nerd-fonts-symbols-README.md
  # The model provider catalog: models.dev data and OpenCode's refresh logic.
  - from: third_party/models-dev/LICENSE
    to: licenses/models-dev-LICENSE.txt
  - from: third_party/opencode/LICENSE
    to: licenses/opencode-LICENSE.txt
  - from: dist
    to: ui
  - from: dist-server
    to: server
  # the companion sidecar — a separate process because it is the only part
  # of the app that listens off this machine, and it stays off until asked
  - from: dist-companion
    to: companion
  - from: skills
    to: skills
  - from: dist-native/android-platform-tools
    to: android-platform-tools

mac:
  # Two single-arch artifacts rather than one universal binary: the app is
  # architecture-specific, and universal would make users download both halves.
  # electron-updater picks by filename (arm64-marked files on Apple silicon,
  # unmarked ones on Intel), so latest-mac.yml must list all four files.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icon
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # the dictation helper is a signed background app — Windows and Linux never see it
  extraResources:
    - from: electron/resources/Pulsa Bot Speech.app
      to: Pulsa Bot Speech.app
    # CUA must live outside ASAR. prepare-cua stages the signed executable and
    # a self-contained JS/native SDK bundle selected for macOS arm64.
    # ${arch} resolves per built arch — each bundle carries its own natives
    - from: dist-native/${arch}/cua-driver
      to: cua-driver
    - from: dist-native/${arch}/cua-sdk
      to: cua-sdk
    - from: dist-native/cloudflared/darwin-${arch}/cloudflared
      to: cloudflared/cloudflared
    - from: dist-native/tailcat/darwin-${arch}/tailcat
      to: tailcat/tailcat
    - from: dist-native/browser/darwin-${arch}
      to: browser-engine
    # The Data engine's native modules (DuckDB, resvg; server/data/engine.ts)
    # as a node_modules tree the server requires at runtime; prepare-duckdb
    # stages this arch's slice. The copy names the node_modules directory
    # itself: electron-builder's resource filter drops a root-level
    # node_modules entry of any tree it copies (app-builder-lib util/filter).
    - from: dist-native/duckdb/darwin-${arch}/node_modules
      to: duckdb/node_modules
  extendInfo:
    NSMicrophoneUsageDescription: Sagax uses the microphone for voice dictation into the composer and for voice mode with your bots.
    NSSpeechRecognitionUsageDescription: Sagax transcribes your voice on-device to type messages for you.
    NSAccessibilityUsageDescription: Sagax uses Accessibility when you let a bot control this Mac.
    NSScreenCaptureUsageDescription: Sagax uses Screen Recording so bots can see this Mac before acting.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  sign: true
  icon: build/icon.icns
  # ${arch} is load-bearing: without it the x64 dmg silently overwrites
  # the arm64 one when both arches build (this section overrides both the
  # top-level and mac-level artifactName, so it must carry the arch itself)
  artifactName: Sagax-${version}-${arch}.dmg

win:
  # x64 and arm64. NSIS with two arches makes ONE installer carrying both
  # (it installs the one matching the PC), so latest.yml keeps a single entry
  # and the updater needs no per-arch feed. The portable zips are per arch.
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.ico
  # Distinct from the top-level artifactName (used by the mac zip), so the
  # Windows zips never collide with the macOS zips in the same release
  # (both would otherwise be Sagax-${version}-x64.zip). The nsis target
  # below keeps its own artifactName, which overrides this for the installer.
  artifactName: Sagax-${version}-win-${arch}.${ext}
  extraResources:
    # cloudflared publishes no Windows arm64 build: prepare-cloudflared stages
    # the pinned amd64 executable as win32-arm64 too (x64 emulation).
    - from: dist-native/cloudflared/win32-${arch}/cloudflared.exe
      to: cloudflared/cloudflared.exe
    - from: dist-native/tailcat/win32-${arch}/tailcat.exe
      to: tailcat/tailcat.exe
    # No Windows arm64 browser bundle exists (Chrome for Testing, agent-browser
    # vendor build): both packages ship the x64 one, which Windows on Arm runs
    # under x64 emulation (server/browser-engine.ts packagedBrowser).
    - from: dist-native/browser/win32-x64
      to: browser-engine
    # The Data engine's native modules (DuckDB, resvg; server/data/engine.ts),
    # per arch. prepare-duckdb stages win32-x64 only: no DuckDB/resvg binding
    # exists for Windows arm64 yet, so that package ships without the Data
    # engine (after-pack does not require it there; the engine says why).
    - from: dist-native/duckdb/win32-${arch}/node_modules
      to: duckdb/node_modules
    # CUA driver and SDK for Windows, per arch (prepare-cua-win stages both),
    # outside ASAR for native modules
    - from: dist-native/cua-win32-${arch}/cua-driver.exe
      to: cua-driver.exe
    - from: dist-native/cua-win32-${arch}/cua-driver-background.exe
      to: cua-driver-background.exe
    - from: dist-native/cua-win32-${arch}/cua-sdk
      to: cua-sdk
  # Signing: package-fork.mjs (the release build) adds a sign hook,
  # scripts/win-sign-trusted.cjs (Azure Trusted Signing through jsign), and
  # forceCodeSigning, so a release build is never unsigned. A plain
  # `pnpm package:win` stays unsigned for local tests. publisherName is NOT
  # set: electron-updater then skips the signer check on updates. Setting it
  # makes every installed signed build reject updates signed by any other
  # subject, so list every subject (old and new) before changing the
  # certificate's organization (docs/releasing.md, Windows signing).

# The Windows install's identity: an update must find the install it
# replaces, or its shortcuts and taskbar pins are lost. Never change these
# without a migration (electron/packaging-windows.node-test.mjs pins them):
# appId com.openmausbot.app (the AppUserModelId the shortcuts and pins
# carry), productName Sagax (Sagax.exe), the per-user folder
# %LOCALAPPDATA%\Programs\openmausbot (package.json "name"), shortcutName.
nsis:
  oneClick: true
  # Per-user: no admin prompt, and every update lands in the same folder.
  perMachine: false
  # One-click has no directory page; an update reuses the folder it finds.
  allowToChangeInstallationDirectory: false
  # Created once, then kept as the person left them: an update passes
  # --keep-shortcuts to the old uninstaller and never recreates a shortcut
  # the person deleted ("always" would).
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Start menu and desktop shortcut: the long name fits there.
  shortcutName: Pulsatrix Sagax
  uninstallDisplayName: Pulsatrix Sagax ${version}
  # Sagax opens again when the installer is done (an in-app update also
  # passes --force-run). The in-app update runs this installer with its
  # progress window, never silently (electron/updater.mjs).
  runAfterFinish: true
  # Refreshes the shell's icons after an update, so shortcuts and taskbar
  # pins that pointed at the replaced Sagax.exe draw its icon again.
  include: build/installer.nsh
  # Versioned, like the .dmg; one installer for x64 and arm64.
  artifactName: Sagax-${version}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Keep the vector source in the freedesktop scalable icon hierarchy. A
  # lone 1024px PNG is not indexed by GNOME's hicolor theme on Ubuntu 24.04.
  icon: build/icon.svg
  category: Utility
  executableName: openmausbot
  synopsis: Your own team of AI bots, in a chat app
  description: A local-first chat app for running a team of AI agents.
  maintainer: Pulsatrix Technologies Inc. <hello+security@pulsatrix.ca>
  vendor: Pulsatrix Technologies
  syncDesktopName: true
  # The reviewed x64 CLI runtime is staged before packaging and remains
  # outside ASAR so executable modes and adjacent sidecars are preserved.
  extraResources:
    - from: dist-native/cua-linux-x64
      to: cua-linux-x64
    - from: dist-native/cloudflared/linux-x64/cloudflared
      to: cloudflared/cloudflared
    - from: dist-native/tailcat/linux-x64/tailcat
      to: tailcat/tailcat
    - from: dist-native/browser/linux-x64
      to: browser-engine
    - from: dist-native/duckdb/linux-x64/node_modules
      to: duckdb/node_modules
    - from: build/linux-openmausbot-browser.apparmor
      to: openmausbot-browser.apparmor
  desktop:
    entry:
      Name: Pulsatrix Sagax
      Comment: Your own team of AI bots, in a chat app
      Keywords: AI;Agents;Chat;Productivity;

deb:
  packageCategory: utils
  priority: optional
  # Add the narrow browser policy's parser without replacing Electron's
  # default shared-library dependencies.
  fpm: ["--depends", "apparmor"]
  # dpkg can preserve legacy directory modes during an upgrade. This
  # idempotent hook repairs only the exact package-owned CUA path.
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh

# Static AppImage runtime: Ubuntu 24.04 can launch it without legacy FUSE 2.
toolsets:
  appimage: "1.0.3"
