# Local mail testing: sign-in codes and invite mails land in Mailpit
# (http://127.0.0.1:8025) instead of a real mailbox. Never for production.
#
#   docker compose -p pulsa -f compose.yaml -f deploy/local/compose.mail-test.yaml up -d
services:
  omb:
    environment:
      OMB_MAIL_PROVIDER: smtp
      OMB_MAIL_FROM: pulsa-bot@localhost
      OMB_SMTP_HOST: mailpit
      OMB_SMTP_PORT: "1025"
      OMB_SMTP_SECURE: none
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
