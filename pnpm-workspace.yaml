# pnpm 11 reads allowBuilds, pnpm 10 reads onlyBuiltDependencies — keep both
# so either version runs the postinstalls this project actually needs.
# A packages list is required for `pnpm list` (electron-builder's collector).
packages:
  - "."
  - "apps/docs"
  - "cloudflare/control-plane"
# Packaging fetches optional binaries for both desktop CPU targets. This lived
# in package.json's "pnpm" field, which pnpm 10.33 ignores — it printed a
# warning on every command and, more to the point, silently was not applied.
supportedArchitectures:
  cpu:
    - arm64
    - x64
allowBuilds:
  electron: true # postinstall downloads the Electron dist
  esbuild: true # postinstall validates the platform binary
  electron-winstaller: false # unused — Windows builds ship NSIS
onlyBuiltDependencies:
  - electron
  - esbuild
# mermaid 12.1 still allows dompurify 3.4.13. Force the patched release.
# Dependabot: transitive copies below the fixed versions (miniflare pins sharp
# 0.35.4; mermaid and rehype-katex pull katex 0.16.x).
# dompurify 3.4.17 fixes the SAFE_FOR_TEMPLATES shadow-root bypass (critical),
# the IN_PLACE detached-subtree hook gap (high) and the SMIL href guard (low).
# @vitest/mocker 4.1.11 (dev-only, via @cloudflare/vitest-plugin -> vitest 4.x)
# has a code-injection and a Windows traversal fix in 4.1.12; the bound keeps
# vitest 5.x's own @vitest/mocker 5.x untouched.
overrides:
  dompurify: 3.4.17
  "@vitest/mocker@<4.1.12": 4.1.12
  sharp@<0.35.5: 0.35.5
  katex@<0.18.2: 0.18.2
  # @simplewebauthn/server (security keys): its certificate parsers stay on
  # releases at least two weeks old; the newest were days old when added.
  "@peculiar/x509": 2.1.0
  "@peculiar/asn1-android": 2.10.0
  "@peculiar/asn1-asym-key": 2.10.0
  "@peculiar/asn1-cms": 2.10.0
  "@peculiar/asn1-csr": 2.10.0
  "@peculiar/asn1-ecc": 2.10.0
  "@peculiar/asn1-pfx": 2.10.0
  "@peculiar/asn1-pkcs8": 2.10.0
  "@peculiar/asn1-pkcs9": 2.10.0
  "@peculiar/asn1-rsa": 2.10.0
  "@peculiar/asn1-schema": 2.10.0
  "@peculiar/asn1-x509-attr": 2.10.0
  "@peculiar/asn1-x509-post-quantum": 2.10.0
  "@peculiar/asn1-x509": 2.10.0
