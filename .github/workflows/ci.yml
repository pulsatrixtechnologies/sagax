name: CI

on:
  workflow_dispatch:
  # CI runs once, on the release candidate (manual dispatch): JC 2026-10-14.

# least privilege: CI only reads the checkout, it never writes back
permissions:
  contents: read

concurrency:
  # A new PR push supersedes that PR's older checks. Main keeps one run going
  # and one waiting: each merge replaces the waiting run, so a burst of
  # merges costs two full runs, not one per merge (fifteen queued behind each
  # other in October 2026). The running one always finishes. A release runs
  # CI on its own commit in a release-ci/v<version> lane when main's run for
  # it was replaced (scripts/release-ci.mjs). Merge-queue runs stay on their
  # own refs. A PR's group is named by its number, never by github.ref: a
  # merged PR's closed event reports the base branch as github.ref, so a
  # ref-named group let every merge cancel main's run (ci-stop-closed.yml).
  group: ci-${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── The test leg, in pieces ──────────────────────────────────────────────
  # One `typecheck + test (<os>)` job used to run everything in sequence:
  # typecheck, lint, the whole vitest suite, then three smokes that only ran
  # when everything before them passed. The suite runs its files serially
  # (vite.config.ts, fileParallelism:false) and takes 17–19 minutes on one
  # runner, so slow runners hit the job cap and read as red PRs, and a broken
  # smoke stayed hidden behind any vitest failure for a day. Each piece is now
  # its own job: platform-independent checks run once, the suite runs in four
  # shards per platform, and every smoke reports on its own. One final `CI`
  # check aggregates the required jobs (see docs/ci.md for ruleset migration).
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # ci-scope reads whether the commit before a push got its own green run
      actions: read
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      mobile: ${{ steps.scope.outputs.mobile }}
      vitest_os: ${{ steps.scope.outputs.vitest_os }}
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets PR selection use the merge base, including deletes
          # and both sides of renames, without GitHub's changed-file page limit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Select checks for this change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs
      - run: pnpm install --frozen-lockfile
      - name: Verify CI selection and documentation references
        run: pnpm exec vitest run scripts/ci-scope.test.ts scripts/ci-workflow.test.ts scripts/testing/verification-docs.test.ts
      - name: Validate locale catalogs
        run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:electron
      - name: production UI build
        run: pnpm exec vite build

  vitest:
    # Admit the expensive runner fan-out only after the quick checks pass.
    # A failing preflight still fails the required gates; nothing is waived.
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # vitest splits the file list deterministically across shards, so a
    # failure names the same shard on every run and one shard is reproducible
    # locally with the same --shard flag.
    name: vitest (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        # The harness and pure desktop capabilities stay portable across all
        # supported host platforms. POSIX-only process tests self-skip.
        # scripts/ci-scope.mjs picks the platforms: pull requests, main
        # pushes and merge groups run Linux only. Windows and macOS run
        # only from a manual dispatch.
        os: ${{ fromJSON(needs.static.outputs.vitest_os) }}
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    # scripts/testing/duration-sequencer.ts splits the files by their recorded
    # CI seconds, not by count, so the heavy e2e files no longer share one
    # shard. The cap catches a hang, not normal suite growth: 0.5.0 brought
    # a shard to 17 minutes of tests plus setup, so Ubuntu has 30. By 0.5.10
    # a balanced Windows shard ran about 31 minutes of tests, and shard 1
    # also runs the Electron step: 35 cancelled it mid-suite, so
    # Windows and macOS have 45.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 30 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron test runtime
        # Electron lazily downloads its runtime on first import. Resolve it
        # before Vitest starts so a cold download cannot consume the fixture
        # timeout.
        run: node --input-type=commonjs -e "require('electron')"
      - name: Run tests
        # The github-actions reporter turns each failure into an annotation
        # on the PR, so the failing test and its assertion are readable
        # without opening the job log.
        env:
          # scripts/testing/ci-retry-runner.ts records each listed flaky test
          # that needed a retry here (the runner context is step-level only).
          SAGAX_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=github-actions
      - name: Report flaky tests that needed a retry
        # Known flakes (scripts/testing/ci-retry-list.json) get two retries in
        # CI. A pass after a retry is still listed in the job summary, so the
        # flake stays visible until its entry is fixed and removed.
        if: ${{ !cancelled() }}
        env:
          SAGAX_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs
      - name: Electron unit tests
        if: matrix.shard == 1
        run: pnpm test:electron

  behavior-evals:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # The offline behavior-eval tiers (#1503): the evals' own vitest gate
    # (redaction, trace, golden replay), the tier-1 scenario runner, and the
    # tier-2 golden replay through the same entrypoint developers use. Tier
    # 3's live models stay opt-in: CI never sets SAGAX_EVAL_LIVE or any live
    # env, and the last step proves the offline gate holds by asserting the
    # skip line is what CI gets.
    name: behavior evals (offline tiers 1-3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Eval suite typecheck (standalone tsconfig)
        # The root typecheck builds src and server only; evals carries its
        # own tsconfig, so its type gate runs here with the rest of the
        # eval surfaces.
        run: pnpm exec tsc -p evals/tsconfig.json
      - name: Eval vitest gate (redaction, trace, golden replay)
        # Same reporter pair as the vitest shards, so a failure annotates
        # the PR with the failing test and assertion.
        run: pnpm exec vitest run --config evals/vitest.config.ts --reporter=default --reporter=github-actions
      - name: Tier 1 scenarios (scripted harness, no models)
        run: pnpm eval
      - name: Tier 2 golden replay against committed baselines
        run: pnpm eval --golden
      - name: Tier 3 stays offline in CI (the skip is the pass condition)
        run: |
          output="$(pnpm eval --live 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "live tier skipped"
      - name: Upload eval run reports on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: behavior-evals-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: evals/reports/runs/
          if-no-files-found: warn
          retention-days: 7

  packaged-server:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # `pnpm build:server`, then the bundle is copied out of the repo and run
    # with no node_modules in reach: every bare import must be inlined. The
    # macOS copy runs inside the macOS smokes job, so it takes no extra
    # macOS runner.
    name: packaged server smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ needs.static.outputs.platforms == 'true' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packaged-server

  windows-cua:
    needs: static
    # Windows/macOS/iOS run only on manual dispatch (platforms=true).
    if: needs.static.outputs.runtime == 'true' && needs.static.outputs.platforms == 'true'
    name: Windows CUA host smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke the staged Windows CUA host (no computer actions)
        timeout-minutes: 5
        run: pnpm build:cua:win && pnpm smoke:cua-win

  electron-smokes:
    needs: static
    # Windows/macOS/iOS run only on manual dispatch (platforms=true).
    if: needs.static.outputs.runtime == 'true' && needs.static.outputs.platforms == 'true'
    # Real Electron utility processes against disposable homes and fake CLIs.
    # Never the live app. Each script prints its own evidence lines. This
    # macOS job runs only from a manual dispatch.
    name: macOS smokes (packaged server + Electron)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron test runtime
        run: node --input-type=commonjs -e "require('electron')"
      - name: Packaged server smoke (macOS)
        # Builds dist-server/ and runs a copy of it outside the repo; the
        # phone-relay smoke below forks the same dist-server/index.js.
        run: pnpm test:packaged-server
      - name: Verify native approval mode transitions
        run: pnpm exec electron scripts/smoke-approval-modes.cjs
      - name: Verify app permissions and guarded display capture
        run: node scripts/smoke-app-permissions.mjs
      - name: Verify paired phone authorization against packaged harness
        # Forks dist-server/index.js, built by the packaged server step.
        run: pnpm build:companion && pnpm exec electron scripts/smoke-phone-relay-auth.cjs

  voice-acceptance:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: voice acceptance (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Synthetic voice acceptance
        run: pnpm voice:acceptance -- --out "$RUNNER_TEMP/voice-acceptance"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: voice-acceptance-synthetic
          path: |
            ${{ runner.temp }}/voice-acceptance/report.json
            ${{ runner.temp }}/voice-acceptance/report.md
          if-no-files-found: warn

  gate:
    # One aggregation, not three queued runners doing the same check.
    name: CI
    needs: [static, vitest, behavior-evals, packaged-server, windows-cua, electron-smokes, voice-acceptance]
    # Still report failed/skipped dependencies, but don't keep a superseded
    # workflow alive just to schedule its summary jobs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const needs = JSON.parse(process.env.NEEDS);
            const rows = Object.entries(needs).map(([job, { result }]) => `${result.padEnd(9)} ${job}`);
            console.log(rows.join("\n"));
            const runtime = needs.static.outputs.runtime;
            if (runtime !== "true" && runtime !== "false") throw new Error("Missing CI selection");
            const bad = Object.entries(needs).filter(([job, { result }]) => {
              const platformOnly = job === "windows-cua" || job === "electron-smokes";
              const platforms = needs.static.outputs.platforms !== "false";
              const expected = job === "static" || (runtime === "true" && (platforms || !platformOnly)) ? "success" : "skipped";
              return result !== expected;
            });
            if (bad.length) { console.error(`\n${bad.length} required job(s) did not pass: ${bad.map(([job]) => job).join(", ")}`); process.exit(1); }
          '

  cloudflared-linux-arm64:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: cloudflared installer (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install and reuse the pinned connector in an isolated fixture
        env:
          SAGAX_ARM64_FIXTURE: ${{ runner.temp }}/omb-cloudflared-arm64
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform, "linux"); assert.equal(process.arch, "arm64");'
          node scripts/prepare-cloudflared.mjs --current --root "$SAGAX_ARM64_FIXTURE"
          node scripts/prepare-cloudflared.mjs --current --root "$SAGAX_ARM64_FIXTURE"
          "$SAGAX_ARM64_FIXTURE/dist-native/cloudflared/linux-arm64/cloudflared" version

  foss:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # LICENSING.md promises that deleting enterprise/ leaves a working
    # open-source edition. Prove it on runtime changes: typecheck, the edition
    # tests, and a boot that reports "oss" even with a key set.
    name: open-source edition builds without enterprise/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the enterprise folder
        run: rm -rf enterprise
      - run: pnpm typecheck
      - run: pnpm exec vitest run server/enterprise.test.ts server/brand.test.ts
      - name: The server boots and reports the open-source edition
        run: |
          mkdir -p /tmp/omb-foss/home
          HOME=/tmp/omb-foss/home SAGAX_DATA_DIR=/tmp/omb-foss/data SAGAX_PORT=18797 SAGAX_WEBHOOK_PORT=18796 \
            SAGAX_BROWSER_CONNECTION=/tmp/omb-foss/browser-connection.json SAGAX_LICENSE_KEY=omb1.not.real \
            node --experimental-strip-types server/index.ts > /tmp/omb-foss/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18797/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18797/api/edition | tee /tmp/omb-foss/edition.json; echo
          grep -q '"edition":"oss"' /tmp/omb-foss/edition.json
          grep -q 'no enterprise layer exists' /tmp/omb-foss/edition.json
          kill %1; wait %1 || true

  control-plane:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: control-plane check + workerd tests + dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm control-plane:check
      - run: pnpm control-plane:test
      - run: pnpm control-plane:dry-run

  ui-smoke:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    # Advisory, outside the required `test` matrix: the renderer recipe in
    # docs/verification/chat-ui.md run by a machine. It downloads the pinned
    # agent-browser release (digest verified) and its Chrome, drives the real
    # <App/> against the isolated fake-engine fixture, and keeps the screenshot.
    # The selectors still name the old header ("More", "New or share", Ctrl+N
    # as New bot). That drift already fails on main and must not fail this run.
    continue-on-error: true
    name: renderer smoke (control-omb ui, Ubuntu 24.04)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner
        # Ubuntu 24.04's AppArmor profile blocks unprivileged user namespaces,
        # so the downloaded Chrome for Testing dies with "No usable sandbox".
        # This is Chrome's own documented fix for 23.10+; a developer machine
        # needs nothing, and the sandbox itself stays on.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Drive the real renderer through control-omb ui
        env:
          SAGAX_UI_E2E: "1"
          SAGAX_UI_EVIDENCE_DIR: .omb-scratch/verify-evidence
        run: pnpm exec vitest run scripts/testing/control-omb-ui.e2e.test.ts scripts/testing/bot-tools-ui.e2e.test.ts scripts/testing/thinking-timer-ui.e2e.test.ts scripts/testing/team-share-ui.e2e.test.ts scripts/testing/org-library-ui.e2e.test.ts scripts/testing/presets-ui.e2e.test.ts
      - name: Upload the renderer screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: control-omb-ui-chat-screenshot
          path: |
            .omb-scratch/verify-evidence/chat-ui.png
            .omb-scratch/verify-evidence/thinking-timer-anchored.png
            .omb-scratch/verify-evidence/share-team-dialog.png
          if-no-files-found: warn
          retention-days: 7

  package-linux:
    needs: static
    if: needs.static.outputs.runtime == 'true'
    name: package + smoke (Ubuntu 24.04 x64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 openbox squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package from the verified offline CUA stage
        run: pnpm package:linux:offline
      - run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Verify the installed browser with Ubuntu sandbox restrictions
        run: node scripts/smoke-browser-bundle.mjs --resources "/opt/Sagax/resources"
      - name: Launch packaged app and verify lifecycle
        env:
          SAGAX_KEEP_SMOKE_DIR: "1"
          SAGAX_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge openmausbot || true
      - name: Upload smoke diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: openmausbot-ubuntu-smoke-diagnostics
          path: |
            /tmp/omb-linux-smoke-*
            /tmp/omb-linux-smoke-runtime-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  ios:
    needs: static
    # Windows/macOS/iOS run only on manual dispatch (platforms=true).
    if: needs.static.outputs.mobile == 'true' && needs.static.outputs.platforms == 'true'
    # The simulator UI suite (about 90 minutes of iPhone + iPad runs) lives in
    # ios-thread-ui.yml and runs by hand. Here it held three of the account's
    # five macOS runners at a time.
    name: Swift tests + iOS build
    runs-on: macos-latest
    # swift test, the simulator build, then one disposable iPhone long
    # enough to screenshot the provider-setup preview. Not the UI suite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift package tests
        run: |
          set -o pipefail
          swift test --package-path ios 2>&1 | tee "$RUNNER_TEMP/swift-test.txt"
      - name: Upload the Swift test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-swift-test
          path: ${{ runner.temp }}/swift-test.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build the simulator app
        run: |
          cd ios
          xcodebuild \
            -project Sagax.xcodeproj \
            -scheme Sagax \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/dd \
            build
      - name: No upstream name in the app bundle
        run: scripts/check-ios-bundle-names.sh ios/build/dd/Build/Products/Debug-iphonesimulator/Sagax.app
      - name: Screenshot the provider setup preview
        run: |
          set -euo pipefail
          runtime_id=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          available = [r for r in runtimes if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          if not available:
              raise SystemExit("No available iOS simulator runtime")
          available.sort(key=lambda r: tuple(int(part) for part in r["version"].split(".")))
          print(available[-1]["identifier"])
          ')
          device_type=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          types = json.load(sys.stdin)["devicetypes"]
          matches = [t for t in types if t["name"] == "iPhone 17 Pro"]
          if not matches:
              matches = [t for t in types if t["name"].startswith("iPhone") and "Pro" in t["name"]]
          if not matches:
              matches = [t for t in types if t["name"].startswith("iPhone")]
          if not matches:
              raise SystemExit("No available iPhone simulator type")
          print(matches[-1]["identifier"])
          ')
          simulator_id=$(xcrun simctl create "sagax-provider-setup-${GITHUB_RUN_ID}" "$device_type" "$runtime_id")
          cleanup() {
            xcrun simctl shutdown "$simulator_id" >/dev/null 2>&1 || true
            xcrun simctl delete "$simulator_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" ios/build/dd/Build/Products/Debug-iphonesimulator/Sagax.app
          xcrun simctl launch "$simulator_id" ca.pulsatrix.sagax -providerSetupPreview -AppleLanguages "(en)" -AppleLocale en_US
          sleep 8
          xcrun simctl io "$simulator_id" screenshot "$RUNNER_TEMP/provider-setup-preview.png"
          test -s "$RUNNER_TEMP/provider-setup-preview.png"
      - name: Upload the provider setup screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-provider-setup-preview
          path: ${{ runner.temp }}/provider-setup-preview.png
          if-no-files-found: error
          retention-days: 7

  # Selection includes ios/** as well as android/**: :core's fixtures come
  # from ios/Tests/CompanionCoreTests/Fixtures.
  android:
    needs: static
    if: needs.static.outputs.mobile == 'true'
    name: Kotlin tests + Android build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          # Robolectric fetches android-all-instrumented from Maven Central at
          # *test* time into ~/.m2 — 278 MB per clean machine that no Gradle
          # cache reaches. This replaces the action's default path, so
          # ~/.gradle/caches has to be named alongside it.
          cache-path: |
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
      - name: Kotlin tests and debug / preview APKs
        run: |
          cd android
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:assemblePreview
      - name: Upload the installable Android preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-threads-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload the Android test reports on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests
            android/core/build/test-results
            android/app/build/reports/tests
            android/app/build/test-results
          if-no-files-found: warn
          retention-days: 7
