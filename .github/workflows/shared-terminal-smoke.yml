name: Candidate Windows launch
on:
  workflow_dispatch:
    inputs:
      sha512:
        description: Installer SHA512 in base64 from the updater feed
        type: string
        required: true
      version:
        description: Installer version
        type: string
        required: true
      publisher_hash:
        description: SHA256 of the expected certificate common name in UTF-8
        type: string
        required: true
permissions:
  contents: read
jobs:
  windows:
    if: github.ref == 'refs/heads/qa/desktop-install-smoke'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    environment: desktop-install-smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - name: Download published reference
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/pulsatrixtechnologies/sagax/releases/download/pulsa-v0.8.170/Sagax-0.8.170-setup.exe' -OutFile "$env:RUNNER_TEMP/candidate.exe"
      - name: Verify published reference
        id: reference
        continue-on-error: true
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_SHA512: 4YZlL/TWn8oxnuQpihjRyYLB7VRoiZ3bYtd6cIO8PBPGI/yIigow/BNtV3i62e25zZ8y+TxTyLALGMRwnFw5Tg==
          EXPECTED_VERSION: 0.8.170
          EXPECTED_PUBLISHER_HASH: ${{ inputs.publisher_hash }}
        run: ./scripts/verify/release/windows-candidate-smoke.ps1
      - name: Remove reference before installing candidate
        shell: pwsh
        run: |
          $entry = Get-ItemProperty 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/*' | Where-Object DisplayName -eq 'Pulsatrix Sagax 0.8.170'
          if (!$entry) { throw 'Reference registration missing.' }
          $bin = [regex]::Match($entry.UninstallString, '^"([^"]+)"').Groups[1].Value
          if ((Split-Path $bin -Leaf) -ne 'Uninstall Sagax.exe') { throw 'Unexpected reference uninstaller.' }
          $uninstall = Start-Process -FilePath $bin -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Reference removal failed.' }
          for ($i = 0; $i -lt 60 -and (Test-Path $bin); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $bin) { throw 'Reference installation still present.' }
          Write-Output 'Reference removed.'
      - name: Download private candidate
        shell: pwsh
        env:
          CANDIDATE_READ_URL: ${{ secrets.CANDIDATE_READ_URL }}
        run: |
          try {
            Invoke-WebRequest -Uri $env:CANDIDATE_READ_URL -OutFile "$env:RUNNER_TEMP/candidate.exe" -ErrorAction Stop
          } catch {
            throw "Private candidate download failed (HTTP $($_.Exception.Response.StatusCode.value__))."
          }
      - name: Verify signature, installation and packaged launch
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_SHA512: ${{ inputs.sha512 }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_PUBLISHER_HASH: ${{ inputs.publisher_hash }}
        run: ./scripts/verify/release/windows-candidate-smoke.ps1
      - name: Require successful reference
        if: always() && steps.reference.outcome != 'success'
        shell: pwsh
        run: throw 'The published reference did not pass this launch validation.'
