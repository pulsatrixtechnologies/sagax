# Fails a pull request whose title, branch name, changed paths, added lines, or
# commit metadata (author/committer name and e-mail, message) contain a
# forbidden term. The term list is NOT stored in this repository: it
# is read from the FORBIDDEN_TERMS Actions secret (newline-separated).
#
# pull_request_target runs in the base repository so the secret is available
# for every pull request, including a fork. The job runs on a GitHub-hosted
# runner and never checks out or runs code from the pull request: it checks
# out the BASE branch (trusted) for the guard script, does not persist
# credentials, and reads the PR diff and commits only as data through the
# API with curl and jq, and the diff with a blobless git fetch (never a
# checkout). Event text is passed only through environment
# variables. If the secret is missing the job fails (fail closed).
name: term-guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: term-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base branch (trusted script only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/term-guard.py
            .github/term-guard-allow-paths.txt
          sparse-checkout-cone-mode: false

      - name: Mask terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          printf '%s\n' "$FORBIDDEN_TERMS" | while IFS= read -r t; do
            t="$(printf '%s' "$t" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -n "$t" ] && echo "::add-mask::$t"
          done
          true

      - name: Fetch PR diff and commits (as data)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$REPO" in
            */*/*|*..*|/*|*/) echo "refusing repository coordinate" >&2; exit 1 ;;
          esac
          owner="${REPO%%/*}"
          name="${REPO#*/}"
          case "$owner" in ''|*[!A-Za-z0-9_.-]*) echo "refusing repository coordinate" >&2; exit 1 ;; esac
          case "$name" in ''|*[!A-Za-z0-9_.-]*) echo "refusing repository coordinate" >&2; exit 1 ;; esac
          case "$PR" in ''|*[!0-9]*) echo "refusing pull request coordinate" >&2; exit 1 ;; esac
          api="https://api.github.com/repos/${REPO}/pulls/${PR}"
          : > "$RUNNER_TEMP/commits.jsonl"
          page=1
          while [ "$page" -le 30 ]; do
            hdr="$RUNNER_TEMP/commits.hdr"
            body="$RUNNER_TEMP/commits.json"
            curl --fail-with-body --silent --show-error \
              --proto '=https' --tlsv1.2 \
              --retry 3 --retry-delay 2 \
              -D "$hdr" -o "$body" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/commits?per_page=100&page=${page}"
            jq -e 'type == "array"' "$body" >/dev/null
            jq -c '.[]' "$body" >> "$RUNNER_TEMP/commits.jsonl"
            if ! grep -qi 'rel="next"' "$hdr"; then
              break
            fi
            if [ "$page" -eq 30 ]; then
              echo "refusing to read more than 30 commit pages" >&2
              exit 1
            fi
            page=$((page + 1))
          done
          # The diff comes from git, not the API's diff media type: GitHub
          # answers that with HTTP 406 past its size limit (300 files or
          # 20,000 lines), which left large pull requests unscanned. A blobless fetch
          # of the two commits into an empty repository, then `git diff` from
          # their merge base (what the pull request shows). Nothing is checked
          # out and no attribute driver runs, so the PR stays data. The
          # repository is public: no credentials are used.
          case "$BASE_SHA" in *[!0-9a-f]*|'') echo "refusing base sha" >&2; exit 1 ;; esac
          case "$HEAD_SHA" in *[!0-9a-f]*|'') echo "refusing head sha" >&2; exit 1 ;; esac
          src="$RUNNER_TEMP/pr-src"
          git init -q --bare "$src"
          git -C "$src" remote add origin "https://github.com/${REPO}.git"
          git -C "$src" config remote.origin.promisor true
          git -C "$src" config remote.origin.partialclonefilter blob:none
          git -C "$src" -c protocol.version=2 fetch -q --no-tags --filter=blob:none origin "$BASE_SHA" "$HEAD_SHA"
          merge_base="$(git -C "$src" merge-base "$BASE_SHA" "$HEAD_SHA")"
          git -C "$src" diff --no-color --no-ext-diff --no-textconv -M "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
          echo "files in diff: $(grep -c '^diff --git ' "$RUNNER_TEMP/pr.diff" || true)"
          echo "diff bytes: $(wc -c < "$RUNNER_TEMP/pr.diff")"
          echo "commits: $(wc -l < "$RUNNER_TEMP/commits.jsonl")"

      - name: Scan title, branch, commits and diff
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/ci/term-guard.py --commits "$RUNNER_TEMP/commits.jsonl" "$RUNNER_TEMP/pr.diff"
