apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sagax-server.name" . }}-edge
  labels:
    {{- include "sagax-server.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {{ .Values.domain }} {
      encode zstd gzip
      handle /hooks/* {
        reverse_proxy 127.0.0.1:8800 {
          lb_try_duration 25s
          lb_try_interval 250ms
          fail_duration 10s
          unhealthy_status 502 503
          health_uri /healthz
          health_interval 2s
          health_timeout 1s
        }
      }
      handle {
        reverse_proxy 127.0.0.1:8799 {
          lb_try_duration 25s
          lb_try_interval 250ms
          fail_duration 10s
          unhealthy_status 502 503
          health_uri /healthz
          health_interval 2s
          health_timeout 1s
          flush_interval -1
        }
      }
    }
