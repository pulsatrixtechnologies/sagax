name: Candidate Windows launch
on:
  workflow_dispatch:
    inputs:
      sha512:
        description: Installer SHA512 in base64 from the updater feed
        type: string
        required: true
      version:
        description: Installer version
        type: string
        required: true
      publisher_hash:
        description: SHA256 of the expected certificate common name in UTF-8
        type: string
        required: true
permissions:
  contents: read
jobs:
  windows:
    if: github.ref == 'refs/heads/qa/desktop-install-smoke'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    environment: desktop-install-smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - name: Download private candidate
        shell: pwsh
        env:
          CANDIDATE_READ_URL: ${{ secrets.CANDIDATE_READ_URL }}
        run: |
          try {
            Invoke-WebRequest -Uri $env:CANDIDATE_READ_URL -OutFile "$env:RUNNER_TEMP/candidate.exe" -ErrorAction Stop
          } catch {
            throw "Private candidate download failed (HTTP $($_.Exception.Response.StatusCode.value__))."
          }
      - name: Verify signature, installation and packaged launch
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_SHA512: ${{ inputs.sha512 }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_PUBLISHER_HASH: ${{ inputs.publisher_hash }}
        run: ./scripts/verify/release/windows-candidate-smoke.ps1
