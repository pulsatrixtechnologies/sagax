# Portable defaults. Azure-specific storage and admin settings live in
# values-azure.yaml. The day/night schedule matches deploy/k8s/tofu/core.
nameOverride: ""

sandboxNamespace: sandboxes
systemNamespace: sandbox-system

# Layout where the provisioner kit (deploy/k8s/provisioner) already created
# the sandbox namespace and runs the provisioner inside it: set
# createSandboxNamespace false, sandboxEgressPolicy.enabled false (the
# provisioner writes one policy per person), provisionerRbac.enabled false
# (the kit owns the Role) and admission.placementObjectSelector to the
# sandbox label. The system namespace is always created.
createSandboxNamespace: true
sandboxEgressPolicy:
  enabled: true
provisionerRbac:
  enabled: true

# Matches server/sandbox/user-sandbox-spec.ts. One environment per person.
sandbox:
  instance: default
  maxRunning: 8
  memory: 1536Mi
  cpu: "1"
  pids: 512
  tmp: 512Mi
  # 2026-11-02: 32 GiB per person (was 2 GiB; Azure Premium bills 20 GiB
  # at the 32 GiB tier anyway). An existing smaller claim
  # grows at its next start (the StorageClass allows expansion).
  workspace: 32Gi
  uid: 1000
  workspaceMount: /workspace
  image: ghcr.io/pulsatrixtechnologies/sagax-sandbox:0.1.0

# Ceilings of the sandbox namespace LimitRange. Empty: sandbox.cpu,
# sandbox.memory and sandbox.workspace. Raise them when a provisioner shares
# the namespace or sizes are raised per person, so nothing running is refused.
limitRange:
  maxCpu: ""
  maxMemory: ""
  maxStorage: ""

quota:
  pods: "8"
  requestsCpu: "8"
  requestsMemory: 12Gi
  # 8 claims of sandbox.workspace (32Gi)
  requestsStorage: 256Gi
  persistentVolumeClaims: "8"

# Encryption at rest is mandatory. The default provisioner is Longhorn,
# which k3s on Proxmox uses. Adapters override the provisioner.
storage:
  className: sagax-sandbox-workspace
  encrypted: true
  provisioner: driver.longhorn.io
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
  allowExpansion: true
  parameters:
    encrypted: "true"
    numberOfReplicas: "2"

# Destinations a sandbox may never reach. Same list as DEFAULT_EGRESS_DENY
# in server/sandbox/user-sandbox-spec.ts. Public internet stays open.
egressDeny:
  - 0.0.0.0/8
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 168.63.129.16/32
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.168.0.0/16
  - 198.18.0.0/15
  - 224.0.0.0/4
  - 240.0.0.0/4

dns:
  namespace: kube-system
  podLabels:
    k8s-app: kube-dns
  port: 53

# Sagax (pulsabot) calls the provisioner. It stays off this cluster in the
# option-3 layout, so allow its network as well as an in-cluster namespace.
sagax:
  namespace: sagax
  port: 8791
  cidrs: []

# #4081: the Perspicax bridge, when the Sagax server runs in this cluster.
# Its public address then lands on the server Pod's private address, which
# egressDeny refuses: this opens only sandbox Pods to the server Pods on the
# port the server's edge serves HTTPS on (the server chart: 443). Leave it
# off while the server has no SAGAX_SANDBOX_BRIDGE_URL (or SAGAX_PUBLIC_URL),
# and when the server runs off the cluster (its public address is reached
# through the public egress already). namespace empty: sagax.namespace.
sagaxBridge:
  enabled: false
  namespace: ""
  podLabels: {}
  port: 443

# Kubernetes API the provisioner is allowed to reach. k3s default service IP.
apiServer:
  cidrs:
    - 10.43.0.1/32
  port: 443

# The Deployment is off until sagax-sandboxd grows a Kubernetes adapter.
# The ServiceAccount and Role are created either way.
provisioner:
  enabled: false
  image: ghcr.io/pulsatrixtechnologies/sagax:0.1.0
  port: 8791
  # 2026-10-26: the provisioner sets the reserve Deployment's replicas from
  # the people at work (server/sandboxd-k8s/sandboxd-k8s-spare.ts): none while nobody
  # works, SAGAX_SANDBOX_K8S_SPARE_COUNT while someone does, none from
  # SAGAX_SANDBOX_K8S_SPARE_MAX_ACTIVE at work. Grants it the scale of that
  # one Deployment in systemNamespace, nothing else. Set
  # SAGAX_SANDBOX_K8S_SPARE_DEPLOYMENT=<systemNamespace>/<deployment> on it.
  spareScaler:
    enabled: false
    deployment: sagax-sandbox-spare
    # The provisioner's ServiceAccount. Empty namespace: systemNamespace (the
    # chart's own provisioner); deploy/k8s/provisioner runs in the sandbox one.
    serviceAccount:
      name: sagax-sandboxd
      namespace: ""

# Cloud agent runs (lot P1.3). One Pod per run, never a person's sandbox,
# in their own namespace with their own quota and node pool. Off by
# default; the provisioner serves runs only with SAGAX_RUNS_ENABLED=1
# (docs/sandbox-kubernetes.md, section "Cloud agent runs").
runs:
  enabled: false
  namespace: sandbox-runs
  # The ServiceAccount the provisioner runs as. The chart's own is
  # sagax-sandboxd in systemNamespace; a provisioner deployed from
  # deploy/k8s/provisioner runs as sagax-sandboxd in the sandbox namespace.
  provisionerServiceAccount:
    name: sagax-sandboxd
    namespace: ""
  # Labels of the provisioner Pod, for the run port's ingress policy.
  # deploy/k8s/provisioner labels its Pod app=sagax-sandboxd.
  provisionerPodLabels:
    app: sagax-sandboxd
  # Who may call the run port (Perspicax only, its real source address:
  # keep the Service on externalTrafficPolicy Local). Required when enabled.
  callerCidrs: []
  port: 8792
  # Decision D3: 12 runs per organization, 4 vCPU / 8 Gi by default,
  # at most 8 vCPU / 16 Gi and a 20 Gi disk per run.
  quota:
    pods: "12"
    requestsCpu: "48"
    limitsCpu: "48"
    requestsMemory: 96Gi
    limitsMemory: 96Gi
    requestsStorage: 240Gi
    persistentVolumeClaims: "24"
    secrets: "24"
  limits:
    maxCpu: "8"
    maxMemory: 16Gi
    maxDisk: 20Gi
    # max duration 12 h plus the 20 min margin (RUN_DEADLINE_MARGIN_SEC)
    maxDeadlineSeconds: 44400
  # The runs pool (P0.3): label px.pool=runs, taint px.run=true:NoSchedule,
  # Spot. AKS adds its own Spot taint, which the run Pods tolerate.
  nodeSelector:
    px.pool: runs
  tolerationKey: px.run
  # Run images, exactly as `registry/name:tag@sha256:<digest>`. Nothing else
  # is admitted in the run namespace, not even another Pulsatrix image.
  allowedImages: []
  # Build cache of coding runs (gap I5, decision D3: Rust builds are big and
  # must stay fast). One disk per person and concurrent slot, kept between
  # runs and reattached to the next one: sccache, the cargo targets (one per
  # environment), the cargo registry, pnpm. Deleted after retentionDays idle.
  # The provisioner needs the matching env (docs/sandbox-kubernetes.md,
  # "Build cache"): SAGAX_RUNS_CACHE_ENABLED=1,
  # SAGAX_RUNS_CACHE_STORAGE_CLASS=<className>, SAGAX_RUNS_CACHE_GIB=<sizeGi>.
  # Enabling it also needs room in quota: requestsStorage grows by sizeGi and
  # persistentVolumeClaims by one per slot (values-azure-run-cache.yaml).
  cache:
    enabled: false
    className: px-run-cache
    sizeGi: 64
    provisioner: driver.longhorn.io
    # Delete: an idle cache is rebuilt, never restored.
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowExpansion: true
    parameters:
      encrypted: "true"
      numberOfReplicas: "1"

# One warm worker from 07:00 to 19:00 America/Toronto, none at night.
# The sandbox pool's autoscaler min is 0; this pod is what holds a node.
warmNode:
  enabled: true
  replicas: 0
  timezone: America/Toronto
  scaleUp: "0 7 * * *"
  scaleDown: "0 19 * * *"
  pauseImage: registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
  kubectlImage: registry.k8s.io/kubectl@sha256:b48ea9c7a5306ad509987009af385561476e4a4c4c75de99bd4b4efbe4d66332
  # Sandbox images pre-pulled on the warm node (digest-pinned, also in admission.allowedImages).
  prepullImages: []
  nodeSelector:
    sagax.io/pool: sandboxes
  tolerationKey: sagax.io/sandboxes
  tolerationValue: "true"
  # Warmer count the morning CronJob sets (0 once every person has a
  # dedicated node and the reserve below keeps the pool warm).
  upReplicas: 1
  # Reserve for a pool with one node per person (SAGAX_SANDBOX_K8S_DEDICATED_NODE).
  # Each reserve pod holds a whole node: its requests must leave less than one
  # sandbox of room on that node (node allocatable minus cpu/memory below is
  # smaller than the sandbox request), so no sandbox lands beside it and one
  # that needs the room evicts it at once. The provisioner scales it
  # (SAGAX_SANDBOX_K8S_SPARE): one reserve per active person, up to
  # SAGAX_SANDBOX_K8S_SPARE_MAX, none when nobody is active.
  spare:
    enabled: false
    priority: -10
    cpu: 1100m
    memory: 2Gi
    # ServiceAccount of the provisioner, which scales the reserve.
    scaler:
      name: sagax-sandboxd
      namespace: ""
    # Added to warmNode.nodeSelector, for example the dedicated pool's label.
    nodeSelector: {}
    # Added to the warmNode toleration, for example the dedicated pool's taint.
    tolerations: []

# Named people only. Off on AKS, where Entra ID and Azure RBAC are the admin
# path. On for k3s (values-k3s.yaml). Never a User subject, never system:masters.
admin:
  kubernetesRbac:
    enabled: false
  group: sagax-admins

admission:
  validating: true
  # Policy for one node and one user namespace per person. validationActions:
  # ["Warn", "Audit"] while people move one at a time, ["Deny"] at the end.
  dedicated:
    enabled: false
    validationActions: ["Warn", "Audit"]
    nodeLabelKey: sagax.io/isolation
    nodeLabelValue: dedicated
  kyverno:
    enabled: true
    failureAction: Enforce
    issuer: https://token.actions.githubusercontent.com
    # Fulcio copies job_workflow_ref into the certificate SAN and does not
    # change case, so the repository name stays Sagax. Anchored to docker.yml
    # on main or on a v* tag (admission.yaml subjectRegExp).
    subjectRegExp: '^https://github\.com/pulsatrixtechnologies/Sagax/\.github/workflows/docker\.yml@refs/(heads/main|tags/v.*)$'
  # Only sandbox pods must sit on the sandbox pool; set to
  # {matchExpressions: [{key: com.pulsatrix.sagax.sandbox.user, operator: Exists}]}
  # when the provisioner shares the sandbox namespace. Empty: every pod.
  placementObjectSelector: {}
  # Bounds the provisioner identity (templates/provisioner-guard.yaml): exec
  # only into sandbox pods, NetworkPolicies only of the shapes it writes.
  # serviceAccount defaults to system:serviceaccount:<systemNamespace>:sagax-sandboxd.
  provisionerGuard:
    enabled: false
    serviceAccount: ""
  # Digest-pinned images that are allowed beside signed Pulsatrix images.
  allowedImages:
    - registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
    - registry.k8s.io/kubectl@sha256:b48ea9c7a5306ad509987009af385561476e4a4c4c75de99bd4b4efbe4d66332

# Velero Schedule. Credentials stay in a Secret this chart does not create.
# destination.provider must name a different operator than productionProvider.
backup:
  enabled: true
  veleroNamespace: velero
  productionProvider: k3s
  schedule: "0 3 * * *"
  ttl: 720h
  destination:
    provider: minio
    veleroProvider: aws
    bucket: sagax-sandbox-backups
    endpoint: https://s3.example.invalid
    region: us-east-1
    credentialSecret: sagax-backup
    credentialKey: cloud

# 2026-10-29: keeps sandbox pods off their own node (kubelet 10250, sshd,
# host ports), which NetworkPolicy does not police. A privileged DaemonSet
# on the sandbox nodes adds an iptables chain that drops new connections
# from pod interfaces to the node. Off by default: it needs a digest-pinned
# image with sh and nsenter (busybox).
nodeGuard:
  enabled: false
  namespace: sagax-node-guard
  image: ""
  # Pod interfaces on the node, as iptables -i patterns. Azure CNI: azv+.
  podInterfaces:
    - azv+
  nodeSelector:
    sagax.io/isolation: dedicated
  tolerations:
    - key: sagax.io/dedicated
      operator: Exists
      effect: NoSchedule
    # The sandbox pool taint (sagax.io/sandboxes=true:NoSchedule): without it the
    # guard never schedules on the pool nodes.
    - key: sagax.io/sandboxes
      operator: Exists
      effect: NoSchedule

