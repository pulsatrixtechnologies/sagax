# sagax-sandboxd on Kubernetes. The Docker socket is not mounted. The image reference is
# deliberately unusable: a mistaken apply does not pull a real image.
# Attestation variables are left unset so the process refuses to serve
# until an operator sets them from a real cluster review.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
  labels:
    app: sagax-sandboxd
spec:
  replicas: 1
  # One provisioner at a time: run quotas are counted in one process.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sagax-sandboxd
  template:
    metadata:
      labels:
        app: sagax-sandboxd
    spec:
      serviceAccountName: sagax-sandboxd
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # The server image runs as the user maus (uid 1001, after node's
        # 1000). The kubelet cannot check runAsNonRoot against a user name.
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandboxd
          image: example.invalid/sagax:must-set
          imagePullPolicy: IfNotPresent
          args: ["dist-server/sandboxd.js"]
          ports:
            - name: https
              containerPort: 8791
          env:
            - name: SANDBOX_BACKEND
              value: kubernetes
            - name: SAGAX_SANDBOX_IMAGE
              value: example.invalid/sagax-sandbox:must-set
            - name: SAGAX_SANDBOX_K8S_REGISTRY
              value: example.invalid
            - name: SAGAX_SANDBOX_K8S_STORAGE_CLASS
              value: must-set-encrypted
            # A dedicated sandbox node pool: its label and its taint, as
            # created (docs/sandbox-kubernetes.md). Empty: the scheduler
            # chooses. Example: sagax.io/pool=sandboxes for both, the
            # toleration as sagax.io/pool=sandboxes:NoSchedule.
            - name: SAGAX_SANDBOX_K8S_NODE_SELECTOR
              value: ""
            - name: SAGAX_SANDBOX_K8S_TOLERATION
              value: ""
            # One node and one user namespace per person (docs/sandbox-kubernetes.md,
            # "One kernel per person"). Off until the dedicated pool exists.
            # DEDICATED_KEYS: * for everyone, sandbox keys to move people one at
            # a time, empty to move everyone back.
            - name: SAGAX_SANDBOX_K8S_HOST_USERS
              value: "true"
            - name: SAGAX_SANDBOX_K8S_DEDICATED_NODE
              value: "0"
            - name: SAGAX_SANDBOX_K8S_DEDICATED_KEYS
              value: "*"
            - name: SAGAX_SANDBOX_K8S_DEDICATED_NODE_SELECTOR
              value: ""
            - name: SAGAX_SANDBOX_K8S_DEDICATED_TOLERATION
              value: ""
            - name: SAGAX_SANDBOX_K8S_DEDICATED_CPUS
              value: ""
            # CPU request below DEDICATED_CPUS (the limit stays); empty: request = limit.
            - name: SAGAX_SANDBOX_K8S_DEDICATED_CPU_REQUEST
              value: ""
            - name: SAGAX_SANDBOX_K8S_DEDICATED_MEMORY_MB
              value: ""
            # Reserve Deployment (chart warmNode.spare) as namespace/name; empty: none.
            - name: SAGAX_SANDBOX_K8S_SPARE
              value: ""
            - name: SAGAX_SANDBOX_K8S_SPARE_MAX
              value: "2"
            # The cluster API's name (AKS: az aks show --query fqdn), or IPv4
            # addresses: resolved at start and every minute, each address is
            # denied as a /32 in every person's policy. The public API IP of a
            # managed cluster changes at each start, and the kubernetes
            # Service IP is translated to it before the policy is evaluated.
            # Empty: off (the pod's KUBERNETES_SERVICE_HOST is that Service
            # IP, so it is never used). On AKS, set the API FQDN.
            - name: SAGAX_SANDBOX_K8S_DENY_HOSTS
              value: ""
            - name: SAGAX_SANDBOXD_TLS_CERT
              value: /var/run/sagax-tls/tls.crt
            - name: SAGAX_SANDBOXD_TLS_KEY
              value: /var/run/sagax-tls/tls.key
            - name: SAGAX_SANDBOX_AUDIT_LOG
              value: /var/log/sagax/sandbox-audit.jsonl
            - name: SAGAX_SANDBOXD_KEY_FILE
              value: /run/sagax-sandboxd/key
            - name: SAGAX_SANDBOXD_LISTEN
              value: 0.0.0.0:8791
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tls
              mountPath: /var/run/sagax-tls
              readOnly: true
            - name: audit
              mountPath: /var/log/sagax
            - name: key
              mountPath: /run/sagax-sandboxd
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: sagax-sandboxd-tls
        - name: audit
          emptyDir: {}
        - name: key
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
spec:
  type: ClusterIP
  selector:
    app: sagax-sandboxd
  ports:
    - name: https
      port: 8791
      targetPort: https
